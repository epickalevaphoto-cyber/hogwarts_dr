<head>

            padding: 0;
            box-sizing: border-box;
        }

            background: #0c0a0f;
            color: #e8e4d8;
            font-family: Arial, sans-serif;
            padding: 20px;
        }

        .app {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            background: rgba(18, 16, 26, 0.85);
            padding: 12px 20px;
            border-radius: 12px;
            border: 1px solid rgba(212, 175, 55, 0.12);
            margin-bottom: 16px;
        }

        .header h1 {
            font-size: 1.3rem;
            color: #d4af37;
        }

        .controls {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            align-items: center;
        }

        .controls button,
        .controls select {
            padding: 6px 14px;
            background: rgba(30, 28, 45, 0.8);
            border: 1px solid rgba(60, 60, 80, 0.25);
            color: #e8e4d8;
            border-radius: 6px;
            font-size: 0.75rem;
            cursor: pointer;
        }

        .btn-gold {
            background: #d4af37 !important;
            color: #0a0a0f !important;
            font-weight: 600;
        }
        .btn-green {
            background: #1a6b47 !important;
            color: #fff !important;
        }
        .btn-outline {
            background: transparent !important;
            border-color: #d4af37 !important;
            color: #d4af37 !important;
        }

        .role-badge {
            font-size: 0.6rem;
            padding: 2px 12px;
            border-radius: 10px;
            background: rgba(212, 175, 55, 0.1);
            color: #d4af37;
            border: 1px solid rgba(212, 175, 55, 0.12);
        }

        .main-grid {
            display: grid;
            grid-template-columns: 200px 1fr;
            gap: 16px;
        }

        .sidebar {
            background: rgba(18, 16, 26, 0.85);
            border-radius: 12px;
            padding: 16px;
            border: 1px solid rgba(60, 60, 80, 0.15);
        }

        .sidebar .title {
            font-size: 0.6rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #555;
            margin-bottom: 10px;
            border-bottom: 1px solid rgba(60, 60, 80, 0.15);
            padding-bottom: 6px;
        }

        .faculty-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            margin-bottom: 2px;
            border-left: 2px solid transparent;
        }

        .faculty-item:hover {
            background: rgba(255, 255, 255, 0.03);
        }

        .faculty-item.active {
            background: rgba(212, 175, 55, 0.05);
            border-left-color: #d4af37;
        }

        .faculty-item .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
        }

        .faculty-item .count {
            margin-left: auto;
            font-size: 0.6rem;
            color: #555;
        }

        .sidebar-actions {
            display: flex;
            flex-direction: column;
            gap: 4px;
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid rgba(60, 60, 80, 0.15);

            border: 1px solid rgba(60, 60, 80, 0.2);
            border-radius: 6px;
            background: rgba(255, 255, 255, 0.02);
            color: #aaa;
            font-size: 0.7rem;
            cursor: pointer;
            text-align: left;

        .sidebar-actions button:hover {

        }

        .journal {

            border-radius: 12px;
            padding: 16px;
            border: 1px solid rgba(60, 60, 80, 0.15);
            overflow-x: auto;
        }

        .journal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.8rem;
            min-width: 600px;
        }

        th {
            text-align: left;
            padding: 6px 4px;
            background: rgba(30, 28, 45, 0.4);
            color: #d4af37;
            font-size: 0.6rem;
            border-bottom: 1px solid rgba(60, 60, 80, 0.2);
        }

        td {

        }
        .faculty-hufflepuff {

            background: rgba(0, 0, 0, 0.25);

        /* Modal */
        .modal {

            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.85);

            height: 8px;

            border-radius: 50%;
        }

            background: #ef5350;
        }

function $(id) { return document.getElementById(id); }

function setSync(text, online) {
    if ($('syncText')) $('syncText').textContent = text;
    if ($('syncDot')) $('syncDot').className = online ? 'online-dot' : 'online-dot offline';

function showTableMessage(message, error = false) {
    const body = $('tableBody');
    if (!body) return;
    const cols = (SUBJECTS[currentCourse] || SUBJECTS[1]).length + 2;
    body.innerHTML = `<tr><td colspan="${cols}" style="text-align:center;padding:20px;color:${error ? '#ef5350' : '#777'};">${escapeHtml(message)}</td></tr>`;
}

function escapeHtml(value) {
    return String(value ?? '')
        .replaceAll('&','&amp;')
        .replaceAll('<','&lt;')
        .replaceAll('>','&gt;')
        .replaceAll('"','&quot;')
        .replaceAll("'","&#039;");
}

function facultyClass(faculty) {

        'Когтевран':'faculty-ravenclaw',

    }[faculty] || '';
}

async function sha256(text) {
    const bytes = new TextEncoder().encode(text);
    const hash = await crypto.subtle.digest('SHA-256', bytes);
    return [...new Uint8Array(hash)].map(b => b.toString(16).padStart(2,'0')).join('');
}

function normalizeStudent(s) {
    return {
        ...s,
        course: Number(s.course),
        grades: (s.grades && typeof s.grades === 'object') ? s.grades : {}
    };
}

    if (!db) return;

    setSync('Загрузка…', false);
    showTableMessage('Подключение к Supabase…');

    const { data, error } = await db
        .from('students')
        .select('id,name,faculty,course,grades,created_at')
        .order('name', { ascending: true });

    if (error) {
        console.error('Supabase students error:', error);
        setSync('Ошибка', false);
        showTableMessage('Ошибка Supabase: ' + error.message, true);
        return;
    }

    students = (data || []).map(normalizeStudent);
    setSync('Online • ' + students.length, true);
    renderAll();
}

async function insertStudent(name, faculty, course) {
    const { data, error } = await db
        .from('students')
        .insert([{ name, faculty, course, grades: {} }])
        .select('id,name,faculty,course,grades,created_at')
        .single();

    if (error) throw error;
    return normalizeStudent(data);
}

async function updateStudent(student) {
    const { data, error } = await db
        .from('students')
        .update({
            name: student.name,
            faculty: student.faculty,
            course: Number(student.course),
            grades: student.grades || {}
        })
        .eq('id', student.id)
        .select('id,name,faculty,course,grades,created_at')
        .single();

    if (error) throw error;
    return normalizeStudent(data);
}

async function deleteStudent(id) {
    const { error } = await db.from('students').delete().eq('id', id);
    if (error) throw error;
}

function renderFaculties() {
    document.querySelectorAll('.faculty-item').forEach(el => {
        const faculty = el.dataset.faculty;
        const count = students.filter(s => s.faculty === faculty).length;
        const id = FACULTY_IDS[faculty];
        const badge = id ? $('count-' + id) : null;
        if (badge) badge.textContent = count;
        el.classList.toggle('active', faculty === currentFaculty);
    });
    if ($('courseSelect')) $('courseSelect').value = String(currentCourse);
}

function renderLegend() {
    const box = $('legend');
    if (!box) return;

    const grades = currentCourse === 7 ? [5,4,3,2,1,0] : [5,0];
    const labels = {
        5:'Превосходно',
        4:'Выше ожидаемого',
        3:'Удовлетворительно',
        2:'Слабо',
        1:'Отвратительно',
        0:'Тролль'
    };

    box.innerHTML = grades.map(g =>
        `<span><span class="swatch" style="background:${GRADE_COLORS[g]}"></span> ${g} — ${currentCourse === 7 ? labels[g] : (g === 5 ? 'Сдал' : 'Не сдал')}</span>`
    ).join('');
}

function renderJournal() {
    const subjects = SUBJECTS[currentCourse] || SUBJECTS[1];
    const filtered = students.filter(s =>
        s.faculty === currentFaculty && Number(s.course) === Number(currentCourse)
    );
    const canEdit = userRole === 'professor' || userRole === 'headmaster';

    if ($('journalTitle')) $('journalTitle').textContent = `📖 Журнал: ${currentCourse} курс`;
    if ($('studentCount')) $('studentCount').textContent = `👨‍🎓 ${filtered.length}`;

    $('tableHead').innerHTML =
        `<tr><th>Ученик</th><th>Факультет</th>${subjects.map(s => `<th>${escapeHtml(s)}</th>`).join('')}</tr>`;

    const body = $('tableBody');

    if (!filtered.length) {
        body.innerHTML = `<tr><td colspan="${subjects.length + 2}" style="text-align:center;color:#555;padding:20px;">Нет учеников</td></tr>`;
        return;
    }

    body.innerHTML = filtered.map(student => {
        const del = (userRole === 'dean' || userRole === 'headmaster')
            ? `<button class="del-btn" data-id="${escapeHtml(student.id)}">✕</button>` : '';

        const cells = subjects.map(subject => {
            const value = student.grades?.[subject];
            const has = value !== undefined && value !== null && value !== '';
            const cls = has ? `g-${value}` : '';
            return `<td><input class="grade-input ${cls}" type="text"
                value="${has ? escapeHtml(value) : ''}"
                data-id="${escapeHtml(student.id)}"
                data-sub="${escapeHtml(subject)}"
                ${canEdit ? '' : 'readonly'}
                placeholder="–"></td>`;
        }).join('');

        return `<tr class="${facultyClass(student.faculty)}">
            <td class="student-name">${escapeHtml(student.name)} ${del}</td>
            <td class="student-faculty">${escapeHtml(student.faculty)}</td>
            ${cells}
        </tr>`;
    }).join('');

    if (userRole === 'dean' || userRole === 'headmaster') {
        body.querySelectorAll('.del-btn').forEach(btn => {
            btn.addEventListener('click', async () => {
                const id = btn.dataset.id;
                const student = students.find(s => String(s.id) === String(id));
                if (!student || !confirm(`Удалить "${student.name}"?`)) return;

                try {
                    await deleteStudent(student.id);
                    students = students.filter(s => String(s.id) !== String(student.id));
                    renderAll();
                } catch (e) {
                    alert('Ошибка удаления: ' + e.message);
                }
            });
        });
    }

    if (canEdit) {
        body.querySelectorAll('.grade-input:not([readonly])').forEach(input => {
            input.addEventListener('blur', async () => {
                const student = students.find(s => String(s.id) === String(input.dataset.id));
                if (!student) return;

                const subject = input.dataset.sub;
                const value = input.value.trim();
                const allowed = currentCourse === 7 ? [5,4,3,2,1,0] : [5,0];

                if (value === '') {
                    delete student.grades[subject];
                } else {
                    const n = Number(value);
                    if (!Number.isInteger(n) || !allowed.includes(n)) {
                        input.value = student.grades?.[subject] ?? '';
                        return;
                    }
                    student.grades[subject] = n;
                }

                try {
                    const saved = await updateStudent(student);
                    Object.assign(student, saved);
                    renderJournal();
                } catch (e) {
                    alert('Ошибка сохранения оценки: ' + e.message);
                    await loadStudents();
                }
            });

            input.addEventListener('keydown', e => {
                if (e.key === 'Enter') input.blur();
            });
        });
    }
}

function renderCertSelect() {
    const select = $('certStudent');
    if (!select) return;

    const old = select.value;
    select.innerHTML = '<option value="">— Выберите ученика —</option>';

    students
        .filter(s => Number(s.course) === 7)
        .sort((a,b) => a.name.localeCompare(b.name,'ru'))
        .forEach(s => {
            const opt = document.createElement('option');
            opt.value = String(s.id);
            opt.textContent = `${s.name} (${s.faculty})`;
            select.appendChild(opt);
        });

    if ([...select.options].some(o => o.value === old)) select.value = old;
}

function renderTransferList() {
    const box = $('transferList');
    if (!box) return;

    const faculty = $('transferFaculty').value;
    const list = students.filter(s => s.faculty === faculty);

    if (!list.length) {
        box.innerHTML = '<div style="color:#555;padding:8px;">Нет студентов</div>';
        return;
    }

    box.innerHTML = list.map(s =>
        `<div><input type="checkbox" class="transfer-check" value="${escapeHtml(s.id)}"> ${escapeHtml(s.name)} (${Number(s.course)} курс)</div>`
    ).join('');
}

function updateUI() {
    const role = ROLE_NAMES[userRole] || 'Гость';
    if ($('roleBadge')) $('roleBadge').textContent = role;
    if ($('currentRoleDisplay')) $('currentRoleDisplay').textContent = role;

    const manage = userRole === 'dean' || userRole === 'headmaster';
    if ($('addBtn')) $('addBtn').style.display = manage ? 'block' : 'none';
    if ($('transferBtn')) $('transferBtn').style.display = manage ? 'block' : 'none';
    if ($('clearBtn')) $('clearBtn').style.display = manage ? 'block' : 'none';
}

function renderAll() {
    renderFaculties();
    renderLegend();
    renderJournal();
    renderCertSelect();
    renderTransferList();
    updateUI();
}

function openModal(id) {
    const el = $(id);
    if (el) el.classList.add('open');
}

function closeModal(id) {
    const el = $(id);
    if (el) el.classList.remove('open');
}

async function login() {
    const username = $('loginUsername').value.trim();
    const password = $('loginPassword').value;
    const errorBox = $('loginError');

    if (!username || !password) {
        errorBox.textContent = '❌ Введите логин и пароль';
        errorBox.className = 'status-msg show error';
        return;
    }

    errorBox.textContent = 'Проверка…';
    errorBox.className = 'status-msg show';

    const { data: user, error } = await db
        .from('users')
        .select('id,username,password_hash,role,display_name')
        .eq('username', username)
        .maybeSingle();

    if (error) {
        console.error(error);
        errorBox.textContent = '❌ Ошибка Supabase: ' + error.message;
        errorBox.className = 'status-msg show error';
        return;
    }

    if (!user) {
        errorBox.textContent = '❌ Пользователь не найден';
        errorBox.className = 'status-msg show error';
        return;
    }

    const hash = await sha256(password);

    if (hash !== user.password_hash) {
        errorBox.textContent = '❌ Неверный пароль';
        errorBox.className = 'status-msg show error';
        return;
    }

    userRole = user.role;
    userName = user.display_name || user.username;
    closeModal('loginModal');
    errorBox.className = 'status-msg';
    $('loginPassword').value = '';
    renderAll();
    alert(`🔓 Добро пожаловать, ${userName}!`);
}

function generateCertificate() {
    const id = $('certStudent').value;
    const student = students.find(s => String(s.id) === String(id));
    if (!student) { alert('Выберите ученика'); return; }

    const order = ['Заклинания','Зельеварение','ЗоТИ','История магии','Маггловедение','Полеты на метле','Прорицание','Травология','Трансфигурация','УЗМС'];
    const subjects = order.filter(s => (SUBJECTS[7] || []).includes(s));

    const dean = {
        'Гриффиндор':'Минерва МакГонагалл',
        'Слизерин':'Северус Снейп',
        'Когтевран':'Филиус Флитвик',
        'Пуффендуй':'Помона Стебль'
    }[student.faculty] || '';

    const names = ['Тролль','Отвратительно','Слабо','Удовлетворительно','Выше ожидаемого','Превосходно'];

    $('certContainer').innerHTML = `
        <div style="background:#f5e6c8;padding:24px;border-radius:14px;border:2px solid #d4af37;color:#1a1a1a;max-width:660px;margin:0 auto;">
            <div style="text-align:center;font-size:1.2rem;border-bottom:2px solid #b8860b;padding-bottom:6px;">HOGWARTS SCHOOL OF<br>WITCHCRAFT AND WIZARDRY</div>
            <div style="text-align:center;font-size:1.4rem;font-weight:700;letter-spacing:4px;color:#b8860b;margin:4px 0;">CERTIFICATE OF COMPLETION</div>
            <div style="text-align:center;font-size:1.6rem;font-weight:700;margin:4px 0 10px;border-bottom:1px dashed #b8860b;padding-bottom:6px;">${escapeHtml(student.name).toUpperCase()}</div>
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:2px 20px;font-size:0.9rem;">
                ${subjects.map(sub => {
                    const v = student.grades?.[sub];
                    return `<div style="display:flex;justify-content:space-between;padding:2px 0;border-bottom:1px dotted rgba(0,0,0,.06);">
                        <span>${escapeHtml(sub)}</span>
                        <strong style="color:#b8860b;">${v === undefined ? 'Не сдано' : names[v]}</strong>
                    </div>`;
                }).join('')}
            </div>
            <div style="display:flex;justify-content:space-between;align-items:flex-end;margin-top:10px;padding-top:6px;border-top:2px solid #b8860b;font-size:0.7rem;">
                <div><strong>ДЕКАН ФАКУЛЬТЕТА</strong><br>${escapeHtml(dean)}<br>${escapeHtml(student.faculty)}</div>
                <div style="text-align:right;"><strong>${new Date().toLocaleDateString('ru-RU')}</strong><br>ДИРЕКТОР<br>Лана МакДауэлл</div>
            </div>
        </div>`;

    $('downloadCertBtn').style.display = 'block';
}

function generateReport() {
    if (!students.length) return '<p style="color:#555;text-align:center;padding:20px;">Нет данных</p>';

    const grouped = {};
    students.forEach(s => {
        const c = Number(s.course) || '?';
        (grouped[c] ||= []).push(s);
    });

    return Object.keys(grouped).sort((a,b) => Number(a)-Number(b)).map(c => {
        const subs = SUBJECTS[c] || SUBJECTS[1];
        return `<h3 style="color:#d4af37;margin:12px 0 6px;">${c} курс (${subs.length} предметов)</h3>
        <table style="font-size:0.7rem;width:100%;border-collapse:collapse;">
        <thead><tr><th>Ученик</th><th>Факультет</th>${subs.map(s=>`<th>${escapeHtml(s)}</th>`).join('')}<th>Сумма</th></tr></thead>
        <tbody>${grouped[c].map(st => {
            let sum = 0;
            const cells = subs.map(sub => {
                const v = st.grades?.[sub];
                if (v !== undefined && v !== null) sum += Number(v);
                return `<td style="text-align:center;">${v ?? ''}</td>`;
            }).join('');
            return `<tr class="${facultyClass(st.faculty)}"><td><strong>${escapeHtml(st.name)}</strong></td><td>${escapeHtml(st.faculty)}</td>${cells}<td style="font-weight:700;color:#d4af37;text-align:center;">${sum}</td></tr>`;
        }).join('')}</tbody></table>`;
    }).join('');
}

function exportExcel() {
    let html = `<html><head><meta charset="UTF-8"><style>table{border-collapse:collapse;font-family:Arial;font-size:12px}th,td{padding:5px 8px;border:1px solid #999}th{background:#d4af37}</style></head><body>`;

    for (let c=1; c<=7; c++) {
        const list = students.filter(s => Number(s.course) === c);
        const subs = SUBJECTS[c];
        html += `<h2>${c} курс</h2><table><tr><th>Ученик</th><th>Факультет</th>${subs.map(s=>`<th>${escapeHtml(s)}</th>`).join('')}<th>Сумма</th></tr>`;
        list.forEach(st => {
            let sum = 0;
            html += `<tr><td>${escapeHtml(st.name)}</td><td>${escapeHtml(st.faculty)}</td>`;
            subs.forEach(sub => {
                const v = st.grades?.[sub];
                if (v !== undefined && v !== null) sum += Number(v);
                html += `<td>${v ?? ''}</td>`;
            });
            html += `<td>${sum}</td></tr>`;
        });
        html += `</table><br>`;
    }

    html += '</body></html>';
    const blob = new Blob([html], {type:'application/vnd.ms-excel'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `HogwartsDaily_${new Date().toISOString().slice(0,10)}.xls`;
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

document.addEventListener('DOMContentLoaded', async () => {
    // IMPORTANT: replace the placeholder key above with the anon key from your Supabase project.
    if (!window.supabase?.createClient) {
        setSync('Supabase CDN error', false);
        showTableMessage('Не загрузилась библиотека Supabase. Проверьте интернет/блокировщик.', true);
        return;
    }

    // The real anon key is inserted automatically below before saving this file.
    db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    $('courseSelect')?.addEventListener('change', e => {
        currentCourse = Number(e.target.value);
        renderAll();
    });

    document.querySelectorAll('.faculty-item').forEach(el => {
        el.addEventListener('click', () => {
            currentFaculty = el.dataset.faculty;
            renderAll();
        });
    });

    $('loginBtn')?.addEventListener('click', () => openModal('loginModal'));
    $('closeLoginBtn')?.addEventListener('click', () => closeModal('loginModal'));
    $('loginConfirmBtn')?.addEventListener('click', login);
    $('loginPassword')?.addEventListener('keydown', e => { if (e.key === 'Enter') login(); });

    $('logoutBtn')?.addEventListener('click', () => {
        userRole = 'guest';
        userName = '';
        closeModal('loginModal');
        renderAll();
    });

    $('addBtn')?.addEventListener('click', () => {
        if (userRole !== 'dean' && userRole !== 'headmaster') return alert('Доступ только у деканов и завуча');
        openModal('addModal');
    });
    $('closeAddBtn')?.addEventListener('click', () => closeModal('addModal'));
    $('addCancelBtn')?.addEventListener('click', () => closeModal('addModal'));

    $('addConfirmBtn')?.addEventListener('click', async () => {
        const names = $('addNames').value.split('\n').map(x=>x.trim()).filter(Boolean);
        const faculty = $('addFaculty').value;
        const course = Number($('addCourse').value);
        const status = $('addStatus');

        if (!names.length) {
            status.textContent = '❌ Введите имена';
            status.className = 'status-msg show error';
            return;
        }

        let added = 0;
        try {
            for (const name of names) {
                if (students.some(s => s.name === name && s.faculty === faculty && Number(s.course) === course)) continue;
                const student = await insertStudent(name, faculty, course);
                students.push(student);
                added++;
            }
            status.textContent = `✅ Добавлено: ${added}`;
            status.className = 'status-msg show ' + (added ? 'success' : 'error');
            $('addNames').value = '';
            renderAll();
            setSync('Online • ' + students.length, true);
        } catch (e) {
            status.textContent = '❌ ' + e.message;
            status.className = 'status-msg show error';
        }
    });

    $('transferBtn')?.addEventListener('click', () => {
        if (userRole !== 'dean' && userRole !== 'headmaster') return alert('Доступ только у деканов и завуча');
        openModal('transferModal');
        renderTransferList();
    });
    $('closeTransferBtn')?.addEventListener('click', () => closeModal('transferModal'));
    $('transferCancelBtn')?.addEventListener('click', () => closeModal('transferModal'));
    $('transferFaculty')?.addEventListener('change', renderTransferList);

    $('transferConfirmBtn')?.addEventListener('click', async () => {
        const ids = [...document.querySelectorAll('.transfer-check:checked')].map(x=>x.value);
        const newCourse = Number($('transferCourse').value);
        const status = $('transferStatus');

        if (!ids.length) {
            status.textContent = '❌ Выберите студентов';
            status.className = 'status-msg show error';
            return;
        }

        let done = 0;
        try {
            for (const id of ids) {
                const st = students.find(s => String(s.id) === String(id));
                if (!st || Number(st.course) === newCourse) continue;
                st.course = newCourse;
                st.grades = {};
                await updateStudent(st);
                done++;
            }
            status.textContent = `✅ Переведено: ${done}`;
            status.className = 'status-msg show success';
            renderAll();
        } catch (e) {
            status.textContent = '❌ ' + e.message;
            status.className = 'status-msg show error';
        }
    });

    $('clearBtn')?.addEventListener('click', async () => {
        if (userRole !== 'dean' && userRole !== 'headmaster') return alert('Доступ только у деканов и завуча');
        const list = students.filter(s => s.faculty === currentFaculty);
        if (!list.length) return alert('Нет студентов');
        if (!confirm(`Удалить всех с факультета ${currentFaculty}?`)) return;

        try {
            for (const st of list) await deleteStudent(st.id);
            students = students.filter(s => s.faculty !== currentFaculty);
            renderAll();
        } catch (e) {
            alert('Ошибка: ' + e.message);
        }
    });

    $('certBtn')?.addEventListener('click', () => {
        if (currentCourse !== 7) return alert('Аттестат только для 7 курса');
        openModal('certModal');
        renderCertSelect();
    });
    $('closeCertBtn')?.addEventListener('click', () => closeModal('certModal'));
    $('generateCertBtn')?.addEventListener('click', generateCertificate);

    $('reportBtn')?.addEventListener('click', () => {
        $('reportContainer').innerHTML = generateReport();
        openModal('reportModal');
    });
    $('closeReportBtn')?.addEventListener('click', () => closeModal('reportModal'));
    $('exportBtn')?.addEventListener('click', exportExcel);

    document.querySelectorAll('.modal').forEach(modal => {
        modal.addEventListener('click', e => {
            if (e.target === modal) modal.classList.remove('open');
        });
    });

    updateUI();
    renderAll();
    await loadStudents();
});
</script>
