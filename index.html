<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hogwarts Daily</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0c0a0f;
            color: #e8e4d8;
            font-family: 'Inter', sans-serif;
            padding: 16px;
            font-size: 14px;
        }

        .app {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            background: rgba(18, 16, 26, 0.85);
            padding: 12px 16px;
            border-radius: 12px;
            border: 1px solid rgba(212, 175, 55, 0.12);
            margin-bottom: 16px;
            gap: 8px;
        }

        .header-brand h1 {
            font-size: 1.2rem;
            background: linear-gradient(135deg, #d4af37, #f9e28c);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header-controls {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            align-items: center;
        }

        .header-controls select,
        .header-controls button {
            padding: 4px 10px;
            background: rgba(30, 28, 45, 0.8);
            border: 1px solid rgba(60, 60, 80, 0.25);
            color: #e8e4d8;
            border-radius: 6px;
            font-size: 0.7rem;
            cursor: pointer;
        }

        .header-controls .btn-gold {
            background: linear-gradient(135deg, #b8860b, #d4af37);
            border: none;
            color: #0a0a0f;
            font-weight: 600;
        }

        .header-controls .btn-outline {
            background: transparent;
            border-color: rgba(212, 175, 55, 0.25);
            color: #d4af37;
        }

        .header-controls .btn-green {
            background: linear-gradient(135deg, #1a6b47, #2e7d32);
            border: none;
            color: #fff;
        }

        .role-badge {
            font-size: 0.6rem;
            padding: 2px 10px;
            border-radius: 10px;
            background: rgba(212, 175, 55, 0.1);
            color: #d4af37;
            border: 1px solid rgba(212, 175, 55, 0.12);
        }

        .role-badge.guest {
            background: rgba(255, 255, 255, 0.03);
            color: #555566;
            border-color: rgba(255, 255, 255, 0.05);
        }

        .online-dot {
            display: inline-block;
            width: 6px;
            height: 6px;
            background: #4caf50;
            border-radius: 50%;
            margin-right: 4px;
            animation: pulse 2s infinite;
        }

        .online-dot.offline {
            background: #ef5350;
            animation: none;
        }

        @keyframes pulse {
            0%,
            100% {
                opacity: 1;
            }
            50% {
                opacity: 0.2;
            }
        }

        .main-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 16px;
        }

        @media (min-width: 768px) {
            .main-grid {
                grid-template-columns: 200px 1fr;
            }
        }

        .sidebar {
            background: rgba(18, 16, 26, 0.85);
            border-radius: 12px;
            padding: 12px 14px;
            border: 1px solid rgba(60, 60, 80, 0.15);
        }

        .sidebar .title {
            font-size: 0.6rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #555566;
            margin-bottom: 8px;
            padding-bottom: 6px;
            border-bottom: 1px solid rgba(60, 60, 80, 0.15);
        }

        .faculty-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.8rem;
            border-left: 2px solid transparent;
            margin-bottom: 2px;
        }

        .faculty-item:hover {
            background: rgba(255, 255, 255, 0.03);
        }

        .faculty-item.active {
            background: rgba(212, 175, 55, 0.05);
            border-left-color: #d4af37;
        }

        .faculty-item .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        .faculty-item .count {
            margin-left: auto;
            font-size: 0.6rem;
            color: #555566;
        }

        .sidebar-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid rgba(60, 60, 80, 0.15);
        }

        .sidebar-actions button {
            flex: 1;
            min-width: 60px;
            padding: 4px 8px;
            border: 1px solid rgba(60, 60, 80, 0.2);
            border-radius: 6px;
            background: rgba(255, 255, 255, 0.02);
            color: #aaaabc;
            font-size: 0.65rem;
            cursor: pointer;
        }

        .sidebar-actions button:hover {
            border-color: #d4af37;
            background: rgba(212, 175, 55, 0.05);
        }

        .sidebar-actions .btn-add {
            border-color: rgba(46, 125, 50, 0.25);
            color: #4caf50;
        }
        .sidebar-actions .btn-transfer {
            border-color: rgba(245, 124, 0, 0.25);
            color: #f57c00;
        }
        .sidebar-actions .btn-danger {
            border-color: rgba(198, 40, 40, 0.25);
            color: #ef5350;
        }
        .sidebar-actions .btn-admin {
            border-color: rgba(212, 175, 55, 0.25);
            color: #d4af37;
        }

        .journal {
            background: rgba(18, 16, 26, 0.85);
            border-radius: 12px;
            padding: 12px 14px;
            border: 1px solid rgba(60, 60, 80, 0.15);
            overflow-x: auto;
        }

        .journal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 8px;
        }

        .journal-header h2 {
            font-size: 1rem;
        }

        .legend {
            display: flex;
            gap: 10px 16px;
            flex-wrap: wrap;
            padding: 6px 0 8px;
            border-bottom: 1px solid rgba(60, 60, 80, 0.12);
            margin-bottom: 8px;
            font-size: 0.6rem;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 4px;
            color: #666688;
        }

        .legend-item .swatch {
            width: 12px;
            height: 12px;
            border-radius: 3px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.75rem;
            min-width: 600px;
        }

        th {
            text-align: left;
            padding: 6px 4px;
            background: rgba(30, 28, 45, 0.4);
            color: #d4af37;
            font-weight: 600;
            font-size: 0.6rem;
            border-bottom: 1px solid rgba(60, 60, 80, 0.2);
            white-space: nowrap;
        }

        td {
            padding: 4px 4px;
            border-bottom: 1px solid rgba(60, 60, 80, 0.08);
            vertical-align: middle;
        }

        .faculty-gryffindor {
            background: rgba(174, 0, 0, 0.12) !important;
        }
        .faculty-slytherin {
            background: rgba(26, 107, 71, 0.12) !important;
        }
        .faculty-ravenclaw {
            background: rgba(42, 75, 124, 0.12) !important;
        }
        .faculty-hufflepuff {
            background: rgba(227, 167, 56, 0.12) !important;
        }
        .faculty-gryffindor:hover td {
            background: rgba(174, 0, 0, 0.2) !important;
        }
        .faculty-slytherin:hover td {
            background: rgba(26, 107, 71, 0.2) !important;
        }
        .faculty-ravenclaw:hover td {
            background: rgba(42, 75, 124, 0.2) !important;
        }
        .faculty-hufflepuff:hover td {
            background: rgba(227, 167, 56, 0.2) !important;
        }

        .student-name {
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .student-name .del-btn {
            background: none;
            border: none;
            color: #555566;
            cursor: pointer;
            font-size: 0.6rem;
            opacity: 0.4;
        }
        .student-name .del-btn:hover {
            color: #ef5350;
            opacity: 1;
        }

        .student-faculty {
            font-size: 0.6rem;
            color: #555566;
        }

        .grade-cell {
            text-align: center;
            padding: 2px;
            min-width: 32px;
        }

        .grade-cell .grade-input {
            width: 28px;
            padding: 2px;
            text-align: center;
            background: rgba(0, 0, 0, 0.25);
            border: 1px solid rgba(60, 60, 80, 0.2);
            border-radius: 4px;
            color: #e8e4d8;
            font-weight: 600;
            font-size: 0.8rem;
        }

        .grade-cell .grade-input:focus {
            outline: none;
            border-color: #d4af37;
        }

        .grade-cell .grade-input.readonly {
            background: transparent;
            border: none;
            cursor: default;
            width: 24px;
        }

        .grade-cell .grade-input.g-5 {
            color: #4caf50;
        }
        .grade-cell .grade-input.g-4 {
            color: #8bc34a;
        }
        .grade-cell .grade-input.g-3 {
            color: #ffb74d;
        }
        .grade-cell .grade-input.g-2 {
            color: #ff9800;
        }
        .grade-cell .grade-input.g-1 {
            color: #ef5350;
        }
        .grade-cell .grade-input.g-0 {
            color: #d32f2f;
        }
        .grade-cell .grade-input.g-empty {
            color: #555566;
        }

        /* MODALS */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.85);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }

        .modal-overlay.open {
            display: flex;
        }

        .modal-content {
            background: #1a1828;
            border-radius: 12px;
            padding: 20px;
            max-width: 560px;
            width: 100%;
            max-height: 90vh;
            overflow: auto;
            border: 1px solid rgba(212, 175, 55, 0.15);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .modal-header h2 {
            font-size: 1.1rem;
            color: #d4af37;
        }

        .modal-header .close-btn {
            background: none;
            border: none;
            font-size: 1.4rem;
            color: #555566;
            cursor: pointer;
        }

        .modal-header .close-btn:hover {
            color: #e8e4d8;
        }

        .form-group {
            margin-bottom: 10px;
        }

        .form-group label {
            display: block;
            font-size: 0.7rem;
            color: #8888aa;
            margin-bottom: 3px;
        }

        .form-group select,
        .form-group textarea,
        .form-group input {
            width: 100%;
            padding: 6px 10px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(60, 60, 80, 0.25);
            border-radius: 6px;
            color: #e8e4d8;
            font-size: 0.85rem;
        }

        .form-group textarea {
            min-height: 80px;
            resize: vertical;
        }

        .form-row {
            display: flex;
            gap: 8px;
        }

        .form-row .form-group {
            flex: 1;
        }

        .btn-row {
            display: flex;
            gap: 6px;
            margin-top: 10px;
        }

        .btn-row button {
            padding: 6px 16px;
            border: none;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
        }

        .btn-row .btn-primary {
            background: linear-gradient(135deg, #b8860b, #d4af37);
            color: #0a0a0f;
            flex: 1;
        }
        .btn-row .btn-secondary {
            background: rgba(255, 255, 255, 0.05);
            color: #8888aa;
            border: 1px solid rgba(60, 60, 80, 0.2);
        }
        .btn-row .btn-danger {
            background: linear-gradient(135deg, #7a0000, #c62828);
            color: #fff;
        }

        .status-msg {
            font-size: 0.75rem;
            margin-top: 6px;
            padding: 6px 10px;
            border-radius: 6px;
            display: none;
        }

        .status-msg.show {
            display: block;
        }
        .status-msg.success {
            color: #4caf50;
            background: rgba(76, 175, 80, 0.08);
            border: 1px solid rgba(76, 175, 80, 0.15);
        }
        .status-msg.error {
            color: #ef5350;
            background: rgba(239, 83, 80, 0.08);
            border: 1px solid rgba(239, 83, 80, 0.15);
        }

        .user-list {
            max-height: 200px;
            overflow-y: auto;
        }

        .user-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 4px 8px;
            border-bottom: 1px solid rgba(60, 60, 80, 0.08);
            font-size: 0.75rem;
        }

        .user-item .user-role {
            font-size: 0.6rem;
            padding: 2px 8px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.05);
        }

        .user-item .user-del {
            background: none;
            border: none;
            color: #555566;
            cursor: pointer;
            font-size: 0.8rem;
        }
        .user-item .user-del:hover {
            color: #ef5350;
        }

        .student-check-list {
            max-height: 150px;
            overflow-y: auto;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 6px;
            padding: 6px 8px;
            border: 1px solid rgba(60, 60, 80, 0.15);
        }

        .check-item {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 3px 4px;
            font-size: 0.75rem;
        }

        .check-item input[type="checkbox"] {
            accent-color: #d4af37;
            cursor: pointer;
        }

        .select-all-row {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 3px 4px 6px 4px;
            border-bottom: 1px solid rgba(60, 60, 80, 0.1);
            margin-bottom: 4px;
            font-size: 0.7rem;
            color: #8888aa;
        }

        /* CERTIFICATE */
        .certificate {
            background: #f5e6c8;
            padding: 20px 24px;
            max-width: 660px;
            border-radius: 14px;
            color: #1a1a1a;
            border: 2px solid #d4af37;
            margin: 0 auto;
        }

        .certificate .school-name {
            font-family: 'Cinzel Decorative', cursive;
            font-size: 1rem;
            text-align: center;
            border-bottom: 2px solid #b8860b;
            padding-bottom: 4px;
            margin-bottom: 4px;
        }

        .certificate .cert-title {
            text-align: center;
            font-size: 1.2rem;
            font-weight: 700;
            letter-spacing: 4px;
            color: #b8860b;
        }

        .certificate .student-name-cert {
            text-align: center;
            font-size: 1.3rem;
            font-weight: 700;
            margin: 4px 0 8px;
            border-bottom: 1px dashed #b8860b;
            padding-bottom: 6px;
        }

        .certificate .grades-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2px 16px;
            margin: 8px 0 12px;
            font-size: 0.85rem;
        }

        .certificate .grade-row {
            display: flex;
            justify-content: space-between;
            padding: 2px 0;
            border-bottom: 1px dotted rgba(0, 0, 0, 0.06);
        }

        .certificate .grade-row .subject {
            font-weight: 500;
        }
        .certificate .grade-row .mark {
            font-weight: 700;
            color: #b8860b;
        }

        .certificate .footer {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin-top: 10px;
            padding-top: 6px;
            border-top: 2px solid #b8860b;
            font-size: 0.7rem;
        }

        .cert-download {
            padding: 6px 16px;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            background: linear-gradient(135deg, #1a6b47, #2e7d32);
            color: #fff;
            margin-top: 10px;
            font-size: 0.8rem;
            display: none;
            width: 100%;
        }

        .cert-select {
            width: 100%;
            padding: 6px 10px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(60, 60, 80, 0.25);
            border-radius: 6px;
            color: #e8e4d8;
            font-size: 0.85rem;
            margin-bottom: 8px;
        }

        /* REPORT */
        #reportContainer table {
            font-size: 0.7rem;
            width: 100%;
            border-collapse: collapse;
        }

        #reportContainer table th {
            font-size: 0.6rem;
            padding: 4px 6px;
            background: rgba(30, 28, 45, 0.4);
            color: #d4af37;
            border-bottom: 1px solid rgba(60, 60, 80, 0.2);
        }

        #reportContainer table td {
            padding: 3px 6px;
            border-bottom: 1px solid rgba(60, 60, 80, 0.08);
        }

        #reportContainer h3 {
            color: #d4af37;
            margin: 12px 0 6px;
            font-size: 1rem;
        }

        .empty-report {
            color: #555566;
            text-align: center;
            padding: 30px;
        }

        .sync-status {
            font-size: 0.6rem;
            color: #555566;
            display: flex;
            align-items: center;
            gap: 4px;
        }
    </style>
</head>
<body>
    <div class="app">
        <!-- HEADER -->
        <header class="header">
            <div class="header-brand">
                <h1>🏰 HOGWARTS DAILY</h1>
            </div>
            <div class="header-controls">
                <select id="courseSelect">
                    <option value="1">1 КУРС</option>
                    <option value="2">2 КУРС</option>
                    <option value="3">3 КУРС</option>
                    <option value="4">4 КУРС</option>
                    <option value="5">5 КУРС</option>
                    <option value="6">6 КУРС</option>
                    <option value="7" selected>7 КУРС</option>
                </select>
                <button class="btn-gold" id="loginBtn">🔑 ВОЙТИ</button>
                <button class="btn-outline" id="certBtn">🏆 АТТЕСТАТ</button>
                <button class="btn-green" id="reportBtn">📊 ОТЧЕТ</button>
                <span class="role-badge guest" id="roleBadge">ГОСТЬ</span>
                <span class="sync-status">
                    <span class="online-dot offline" id="syncDot"></span>
                    <span id="syncText">Offline</span>
                </span>
            </div>
        </header>

        <!-- MAIN -->
        <div class="main-grid">
            <!-- SIDEBAR -->
            <aside class="sidebar">
                <div class="title">ФАКУЛЬТЕТЫ</div>
                <div id="facultyList">
                    <div class="faculty-item active" data-faculty="Гриффиндор">
                        <span class="dot" style="background:#ae0000;"></span> Гриффиндор
                        <span class="count" id="count-gryffindor">0</span>
                    </div>
                    <div class="faculty-item" data-faculty="Слизерин">
                        <span class="dot" style="background:#1a6b47;"></span> Слизерин
                        <span class="count" id="count-slytherin">0</span>
                    </div>
                    <div class="faculty-item" data-faculty="Когтевран">
                        <span class="dot" style="background:#2a4b7c;"></span> Когтевран
                        <span class="count" id="count-ravenclaw">0</span>
                    </div>
                    <div class="faculty-item" data-faculty="Пуффендуй">
                        <span class="dot" style="background:#e3a738;"></span> Пуффендуй
                        <span class="count" id="count-hufflepuff">0</span>
                    </div>
                </div>
                <div class="sidebar-actions">
                    <button class="btn-add" id="addStudentsBtn">➕ Добавить</button>
                    <button class="btn-transfer" id="transferBtn">🔄 Перевод</button>
                    <button class="btn-danger" id="clearFacultyBtn">🗑️ Очистить</button>
                    <button class="btn-admin" id="adminBtn" style="display:none;">⚙️ Админ</button>
                </div>
            </aside>

            <!-- JOURNAL -->
            <main class="journal">
                <div class="journal-header">
                    <h2 id="journalTitle">📖 Журнал: 7 курс</h2>
                    <span id="studentCount">👨‍🎓 0</span>
                </div>
                <div class="legend" id="legendContainer"></div>
                <div class="table-wrap">
                    <table>
                        <thead id="tableHead">
                            <tr><th>Ученик</th><th>Факультет</th></tr>
                        </thead>
                        <tbody id="tableBody">
                            <tr><td colspan="10" style="text-align:center;color:#555566;padding:20px;">Загрузка...</td></tr>
                        </tbody>
                    </table>
                </div>
            </main>
        </div>
    </div>

    <!-- ADD MODAL -->
    <div class="modal-overlay" id="addModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>➕ Добавить студентов</h2>
                <button class="close-btn" id="closeAddBtn">✕</button>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>Курс</label>
                    <select id="addCourseSelect">
                        <option value="1">1</option><option value="2">2</option>
                        <option value="3">3</option><option value="4">4</option>
                        <option value="5">5</option><option value="6">6</option>
                        <option value="7" selected>7</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Факультет</label>
                    <select id="addFacultySelect">
                        <option value="Гриффиндор">🦁 Гриффиндор</option>
                        <option value="Слизерин">🐍 Слизерин</option>
                        <option value="Когтевран">🦅 Когтевран</option>
                        <option value="Пуффендуй">🦡 Пуффендуй</option>
                    </select>
                </div>
            </div>
            <div class="form-group">
                <label>Список студентов</label>
                <textarea id="addStudentsTextarea" placeholder="Поттер Гарри&#10;Грейнджер Гермиона"></textarea>
            </div>
            <div class="status-msg" id="addStatus"></div>
            <div class="btn-row">
                <button class="btn-primary" id="addStudentsConfirmBtn">📥 Добавить</button>
                <button class="btn-secondary" id="addStudentsCancelBtn">Отмена</button>

        function getFacultyClass(faculty) {
            const map = { 'Гриффиндор': 'faculty-gryffindor', 'Слизерин': 'faculty-slytherin',
                'Когтевран': 'faculty-ravenclaw', 'Пуффендуй': 'faculty-hufflepuff' };

        function updateSyncStatus(connected) {
            const dot = document.getElementById('syncDot');
            const text = document.getElementById('syncText');

            if (text) text.textContent = connected ? 'Online' : 'Offline';
        }

        // ============================================================
        // HASH PASSWORD
        // ============================================================
        async function hashPassword(password) {
            const encoder = new TextEncoder();
            const data = encoder.encode(password);
            const hashBuffer = await crypto.subtle.digest('SHA-256', data);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
        }

        // ============================================================
        // SUPABASE OPERATIONS
        // ============================================================
        async function loadStudents() {
            try {
                const { data, error } = await supabase.from('students').select('*').order('id', { ascending: true });
                if (error) throw error;
                students = data.map(s => ({ id: s.id, name: s.name, faculty: s.faculty, course: s.course, grades: s
                        .grades || {} }));
                updateSyncStatus(true);
                console.log('✅ Загружено:', students.length, 'студентов');
                renderAll();
                return data;
            } catch (err) {
                console.error('❌ Ошибка загрузки:', err);
                updateSyncStatus(false);
                return null;
            }
        }

        async function saveStudent(student) {
            try {
                const { error } = await supabase.from('students').upsert({
                    id: student.id,
                    name: student.name,
                    faculty: student.faculty,
                    course: student.course,
                    grades: student.grades || {}
                }, { onConflict: 'id' });
                if (error) throw error;
                return true;
            } catch (err) {
                console.error('Ошибка сохранения:', err);
                return false;
            }
        }

        async function deleteStudentDB(id) {
            try {
                const { error } = await supabase.from('students').delete().eq('id', id);
                if (error) throw error;
                return true;
            } catch (err) {
                console.error('Ошибка удаления:', err);
                return false;
            }
        }

        async function loginUser(username, password) {
            try {
                const hashed = await hashPassword(password);
                const { data, error } = await supabase.from('users').select('*')
                    .eq('username', username).eq('password', hashed).maybeSingle();
                if (error) throw error;
                return data;
            } catch (err) {
                console.error('Ошибка входа:', err);
                return null;
            }
        }

        async function loadUsers() {
            try {
                const { data, error } = await supabase.from('users').select('*').order('id');
                if (error) throw error;
                return data;
            } catch (err) { return []; }
        }

        async function addUserDB(username, password, role, displayName) {
            const hashed = await hashPassword(password);
            const { error } = await supabase.from('users').insert({
                username,
                password: hashed,
                role,
                display_name: displayName || username
            });
            if (error) throw error;
        }

        async function deleteUserDB(id) {
            const { error } = await supabase.from('users').delete().eq('id', id);
            if (error) throw error;
        }

        // ============================================================
        // STUDENT MANAGEMENT
        // ============================================================
        async function addStudentsFromList(names, faculty, course) {
            const lines = names.split('\n').filter(l => l.trim());
            let added = 0,
                dup = 0;
            for (const line of lines) {
                const name = line.trim();
                if (!name) continue;
                if (students.some(s => s.name === name && s.faculty === faculty && s.course === course)) { dup++; continue; }
                const newStudent = { id: Date.now() + Math.random() * 1000 + added, name, faculty, course, grades: {} };
                const ok = await saveStudent(newStudent);
                if (ok) { students.push(newStudent);
                    added++; }
            }
            if (added > 0 || dup > 0) { renderAll(); return { added, dup }; }
            return null;
        }

        async function deleteStudent(id, name) {
            if (!confirm(`Удалить "${name}"?`)) return;
            if (await deleteStudentDB(id)) {
                students = students.filter(s => s.id !== id);
                renderAll();
            }
        }

        async function clearFaculty(faculty) {
            const toDel = students.filter(s => s.faculty === faculty);
            if (!toDel.length) { alert(`Нет студентов на ${faculty}`); return; }
            if (!confirm(`Удалить всех с ${faculty}? (${toDel.length} чел.)`)) return;
            let deleted = 0;
            for (const s of toDel) {
                if (await deleteStudentDB(s.id)) deleted++;
            }
            if (deleted > 0) {
                students = students.filter(s => s.faculty !== faculty);
                renderAll();
            }
        }

        async function transferStudents(studentIds, newCourse) {
            let transferred = 0;
            for (const id of studentIds) {
                const student = students.find(s => s.id === id);
                if (!student || student.course === newCourse) continue;
                student.course = newCourse;
                student.grades = {};
                if (await saveStudent(student)) transferred++;
            }
            if (transferred > 0) renderAll();
            return transferred;
        }

        // ============================================================
        // RENDER
        // ============================================================
        function renderAll() {
            renderFaculties();
            renderJournal();
            renderLegend();
            renderCertSelect();
            renderTransferList();
            updateUI();
        }

        function renderFaculties() {
            document.querySelectorAll('.faculty-item').forEach(el => {
                const f = el.dataset.faculty;
                const count = students.filter(s => s.faculty === f).length;
                const badge = document.getElementById(`count-${f.toLowerCase()}`);
                if (badge) badge.textContent = count;
                el.classList.toggle('active', f === currentFaculty);
            });
            document.getElementById('courseSelect').value = currentCourse;
        }

        function renderLegend() {
            const container = document.getElementById('legendContainer');
            if (!container) return;
            const grades = currentCourse === 7 ? [5, 4, 3, 2, 1, 0] : [5, 0];
            let html = '';
            grades.forEach(g => {
                const label = currentCourse === 7 ? GRADE_MAP_7[g] : (g === 5 ? 'Сдал' : 'Не сдал');
                html +=
                    `<span class="legend-item"><span class="swatch" style="background:${GRADE_COLORS[g]};"></span>${g} — ${label}</span>`;
            });
            container.innerHTML = html;
        }

        function renderJournal() {
            const course = currentCourse;
            const faculty = currentFaculty;
            const subjects = SUBJECTS[course] || SUBJECTS[1];
            const filtered = students.filter(s => s.faculty === faculty && s.course === course);
            const canEdit = userRole === 'professor' || userRole === 'headmaster';

            document.getElementById('journalTitle').textContent = `📖 Журнал: ${course} курс`;
            document.getElementById('studentCount').textContent = `👨‍🎓 ${filtered.length}`;

            const thead = document.getElementById('tableHead');
            let hRow = `<tr><th>Ученик</th><th>Факультет</th>`;
            subjects.forEach(s => { hRow += `<th>${s}</th>`; });
            hRow += `</tr>`;
            thead.innerHTML = hRow;

            const tbody = document.getElementById('tableBody');
            if (!filtered.length) {
                tbody.innerHTML =
                    `<tr><td colspan="${subjects.length + 2}" style="text-align:center;color:#555566;padding:20px;">Нет учеников на ${faculty}</td></tr>`;
                return;
            }

            let html = '';
            filtered.forEach(student => {
                const fClass = getFacultyClass(student.faculty);
                html += `<tr class="${fClass}">`;
                html += `<td class="student-name">
                            ${student.name}
                            ${(userRole === 'dean' || userRole === 'headmaster') ? `<button class="del-btn" data-id="${student.id}">✕</button>` : ''}
                        </td>`;
                html += `<td class="student-faculty">${student.faculty}</td>`;
                subjects.forEach(sub => {
                    const val = student.grades[sub];
                    const has = val !== undefined && val !== null;
                    const display = has ? val : '';
                    const cls = has ? `g-${val}` : 'g-empty';
                    const readonly = !canEdit ? 'readonly' : '';
                    html +=
                        `<td class="grade-cell"><input class="grade-input ${cls} ${readonly}" type="text" value="${display}" data-id="${student.id}" data-sub="${sub}" ${readonly ? 'readonly' : ''} placeholder="–"></td>`;
                });
                html += `</tr>`;
            });
            tbody.innerHTML = html;

            // Delete buttons
            if (userRole === 'dean' || userRole === 'headmaster') {
                tbody.querySelectorAll('.del-btn').forEach(btn => {
                    btn.addEventListener('click', function() {
                        const id = parseInt(this.dataset.id);
                        const student = students.find(s => s.id === id);
                        if (student) deleteStudent(id, student.name);
                    });
                });
            }

            // Grade editing
            if (canEdit) {
                tbody.querySelectorAll('.grade-input:not([readonly])').forEach(input => {
                    input.addEventListener('blur', async function() {
                        const val = this.value.trim();
                        const studentId = parseInt(this.dataset.id);
                        const subject = this.dataset.sub;
                        const student = students.find(s => s.id === studentId);
                        if (!student) return;
                        const available = currentCourse === 7 ? [5, 4, 3, 2, 1, 0] : [5, 0];
                        if (val === '') {
                            delete student.grades[subject];
                        } else {
                            const num = parseInt(val);
                            if (!isNaN(num) && available.includes(num)) {
                                student.grades[subject] = num;
                            } else {
                                const prev = student.grades[subject];
                                this.value = prev !== undefined && prev !== null ? prev : '';
                                this.className = `grade-input ${prev !== undefined && prev !== null ? 'g-' + prev : 'g-empty'}`;
                                return;
                            }
                        }
                        await saveStudent(student);
                        renderJournal();
                    });
                    input.addEventListener('keydown', function(e) { if (e.key === 'Enter') this.blur(); });
                });
            }
        }

        function renderCertSelect() {
            const select = document.getElementById('certStudentSelect');

        // ============================================================
        // CERTIFICATE

                html += `<div class="grade-row"><span class="subject">${sub}</span><span class="mark">${text}</span></div>`;
            });
            const now = new Date();
            const months = ['JANUARY', 'FEBRUARY', 'MARCH', 'APRIL', 'MAY', 'JUNE', 'JULY', 'AUGUST', 'SEPTEMBER', 'OCTOBER',
                'NOVEMBER', 'DECEMBER'
            ];
            const dateStr = `${now.getDate()} ${months[now.getMonth()]}, ${now.getFullYear()}`;
            html += `
                    </div>
                    <div class="footer">
                        <div><div style="font-weight:700;font-size:0.6rem;color:#4a4a4a;">ДЕКАН ФАКУЛЬТЕТА</div>
                        <div class="dean-name">${deanName}</div><div style="font-size:0.6rem;color:#666;">${student.faculty}</div></div>
                        <div style="text-align:right;"><div class="date">${dateStr}</div>
                        <div style="font-weight:700;font-size:0.6rem;color:#4a4a4a;">ДИРЕКТОР</div>
                        <div class="director-name">${DIRECTOR}</div><div style="font-size:0.6rem;color:#666;">Директор</div></div>
                    </div>
                </div>`;
            document.getElementById('certificateContainer').innerHTML = html;
            document.getElementById('downloadCertBtn').style.display = 'block';
        }

        function downloadCertificate() {
            const el = document.getElementById('certificateDisplay');
            if (!el) { alert('Сначала сгенерируйте аттестат'); return; }
            if (typeof html2canvas === 'undefined') {
                alert('Библиотека html2canvas загружается... Попробуйте через минуту');
                return;
            }
            html2canvas(el, { scale: 2, backgroundColor: '#f5e6c8' }).then(canvas => {
                const link = document.createElement('a');
                link.download = `Аттестат_${document.getElementById('certStudentSelect').value || 'student'}.png`;
                link.href = canvas.toDataURL('image/png');
                link.click();
            }).catch(err => {
                alert('Ошибка: ' + err.message);
            });
        }

        // ============================================================
        // REPORT
        // ============================================================
        function generateReport() {
            const grouped = {};
            students.forEach(s => {
                const c = s.course || '?';
                if (!grouped[c]) grouped[c] = [];
                grouped[c].push(s);
            });
            const sorted = Object.keys(grouped).sort((a, b) => { if (a === '?') return 1; if (b === '?') return -1; return parseInt(
                    a) - parseInt(b); });
            let html = '';
            sorted.forEach(c => {
                const list = grouped[c];
                const subs = SUBJECTS[parseInt(c)] || SUBJECTS[1];
                html += `<h3>${c} курс (${subs.length} предметов)</h3><table><thead><tr><th>Ученик</th><th>Факультет</th>`;
                subs.forEach(s => { html += `<th>${s}</th>`; });
                html += `<th>Сумма</th></tr></thead><tbody>`;
                list.forEach(st => {
                    const fClass = getFacultyClass(st.faculty);
                    html += `<tr class="${fClass}"><td><strong>${st.name}</strong></td><td style="color:#666;font-size:0.6rem;">${st.faculty}</td>`;
                    let sum = 0;
                    subs.forEach(sub => {
                        const v = st.grades[sub];
                        const has = v !== undefined && v !== null;
                        html +=
                            `<td style="text-align:center;font-weight:600;color:${has ? GRADE_COLORS[v] || '#e8e4d8' : '#555'};">${has ? v : ''}</td>`;
                        if (has) sum += v;
                    });
                    html += `<td style="font-weight:700;color:#d4af37;text-align:center;">${sum}</td></tr>`;
                });
                html += `</tbody></table>`;
            });
            if (!Object.keys(grouped).length) html = `<p class="empty-report">Нет данных</p>`;
            return html;
        }

        function exportExcel() {
            try {
                const grouped = {};
                students.forEach(s => {
                    const c = s.course || '?';
                    if (!grouped[c]) grouped[c] = [];
                    grouped[c].push(s);
                });
                let html =
                    `<html><head><meta charset="UTF-8"><style>table{border-collapse:collapse;font-family:Arial;font-size:12px;}th{background:#d4af37;padding:6px 8px;border:1px solid #000;}td{padding:4px 8px;border:1px solid #999;}.course-title{font-size:16px;font-weight:bold;padding:10px 0;}</style></head><body>`;
                for (let c = 1; c <= 7; c++) {
                    const list = grouped[c] || [];
                    const subjects = SUBJECTS[c] || [];
                    html += `<div class="course-title">${c} курс</div><table><tr><th>Ученик</th><th>Факультет</th>`;
                    subjects.forEach(s => { html += `<th>${s}</th>`; });
                    html += `<th>Сумма</th></tr>`;
                    if (!list.length) {
                        html += `<tr><td colspan="${subjects.length + 3}" style="text-align:center;color:#999;">Нет студентов</td></tr>`;
                    } else {
                        list.forEach(st => {
                            html += `<tr><td>${st.name}</td><td>${st.faculty}</td>`;
                            let sum = 0;
                            subjects.forEach(sub => {
                                const v = st.grades[sub];
                                const val = (v !== undefined && v !== null) ? v : '';
                                html += `<td style="text-align:center;">${val}</td>`;
                                if (val) sum += parseInt(val);
                            });
                            html += `<td style="text-align:center;font-weight:bold;color:#b8860b;">${sum}</td></tr>`;
                        });
                    }
                    html += `</table><br>`;
                }
                html += `</body></html>`;
                const blob = new Blob([html], { type: 'application/vnd.ms-excel' });
                const link = document.createElement('a');
                link.href = URL.createObjectURL(blob);
                link.download = `HogwartsDaily_${new Date().toISOString().slice(0,10)}.xls`;
                link.click();
                alert('✅ Excel скачан!');
            } catch (err) { alert('❌ Ошибка: ' + err.message); }
        }

        // ============================================================
        // ADMIN
        // ============================================================
        async function renderAdminPanel() {
            const container = document.getElementById('userList');
            try {
                const users = await loadUsers();
                if (!users || !users.length) {
                    container.innerHTML = '<div style="color:#555;padding:10px;">Нет пользователей</div>';
                    return;
                }
                let html = '';
                users.forEach(u => {
                    const roleClass = u.role || 'professor';
                    html += `<div class="user-item">
                        <span><strong>${u.display_name || u.username}</strong> (@${u.username})</span>
                        <span class="user-role ${roleClass}">${ROLE_NAMES[u.role] || u.role}</span>
                        ${u.username !== 'headmaster' ? `<button class="user-del" data-id="${u.id}">✕</button>` : ''}
                    </div>`;
                });
                container.innerHTML = html;
                container.querySelectorAll('.user-del').forEach(btn => {
                    btn.addEventListener('click', async function() {
                        const id = parseInt(this.dataset.id);
                        if (confirm('Удалить пользователя?')) {
                            await deleteUserDB(id);
                            document.getElementById('adminStatus').textContent = '✅ Удален';
                            document.getElementById('adminStatus').className = 'status-msg show success';
                            renderAdminPanel();
                        }
                    });
                });
            } catch (err) {
                container.innerHTML = '<div style="color:#ef5350;padding:10px;">Ошибка</div>';
            }
        }

        // ============================================================
        // INIT
        // ============================================================
        async function init() {
            // Load html2canvas
            const script = document.createElement('script');
            script.src = 'https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js';
            document.head.appendChild(script);

            // Load data
            await loadStudents();

            // Realtime subscription
            supabase.channel('students-changes')
                .on('postgres_changes', { event: '*', schema: 'public', table: 'students' }, () => {
                    console.log('🔄 Обновление...');
                    loadStudents();
                })
                .subscribe();

            // ===== EVENTS =====

            document.getElementById('courseSelect').addEventListener('change', function() {
                currentCourse = parseInt(this.value);
                renderAll();
            });

            document.querySelectorAll('.faculty-item').forEach(el => {
                el.addEventListener('click', function() {
                    currentFaculty = this.dataset.faculty;
                    renderAll();
                });
            });

            // Login
            document.getElementById('loginBtn').addEventListener('click', function() {
                document.getElementById('loginModal').classList.add('open');
            });
            document.getElementById('closeLoginBtn').addEventListener('click', function() {
                document.getElementById('loginModal').classList.remove('open');
            });
            document.getElementById('loginForm').addEventListener('submit', async function(e) {
                e.preventDefault();
                const username = document.getElementById('loginUsername').value.trim();
                const password = document.getElementById('loginPassword').value;
                if (!username || !password) {
                    document.getElementById('loginError').textContent = '❌ Введите логин и пароль';
                    document.getElementById('loginError').className = 'status-msg show error';
                    return;
                }
                const user = await loginUser(username, password);
                if (user) {
                    userRole = user.role;
                    userName = user.display_name || user.username;
                    document.getElementById('loginModal').classList.remove('open');
                    renderAll();
                    alert(`🔓 Добро пожаловать, ${userName}!`);
                } else {
                    document.getElementById('loginError').textContent = '❌ Неверный логин или пароль';
                    document.getElementById('loginError').className = 'status-msg show error';
                }
            });
            document.getElementById('logoutBtn').addEventListener('click', function() {
                userRole = 'guest';
                userName = '';
                document.getElementById('loginModal').classList.remove('open');
                renderAll();
                alert('🚪 Вы вышли');
            });

            // Add students
            document.getElementById('addStudentsBtn').addEventListener('click', function() {
                if (userRole !== 'dean' && userRole !== 'headmaster') {
                    alert('Доступ только у деканов и завуча');
                    return;
                }
                document.getElementById('addModal').classList.add('open');
                document.getElementById('addStudentsTextarea').value = '';
                document.getElementById('addStatus').className = 'status-msg';
            });
            document.getElementById('closeAddBtn').addEventListener('click', function() {
                document.getElementById('addModal').classList.remove('open');
            });
            document.getElementById('addStudentsCancelBtn').addEventListener('click', function() {
                document.getElementById('addModal').classList.remove('open');
            });
            document.getElementById('addModal').addEventListener('click', function(e) {
                if (e.target === this) this.classList.remove('open');
            });
            document.getElementById('addStudentsConfirmBtn').addEventListener('click', async function() {
                const names = document.getElementById('addStudentsTextarea').value;
                const faculty = document.getElementById('addFacultySelect').value;
                const course = parseInt(document.getElementById('addCourseSelect').value);
                if (!names.trim()) {
                    document.getElementById('addStatus').textContent = '❌ Введите имена';
                    document.getElementById('addStatus').className = 'status-msg show error';
                    return;
                }
                const result = await addStudentsFromList(names, faculty, course);
                if (result) {
                    document.getElementById('addStatus').textContent =
                        `✅ Добавлено: ${result.added}${result.dup > 0 ? ` (${result.dup} пропущено)` : ''}`;
                    document.getElementById('addStatus').className = 'status-msg show success';
                    document.getElementById('addStudentsTextarea').value = '';
                } else {
                    document.getElementById('addStatus').textContent = '❌ Ошибка';
                    document.getElementById('addStatus').className = 'status-msg show error';
                }
            });

            // Transfer
            document.getElementById('transferBtn').addEventListener('click', function() {
                if (userRole !== 'dean' && userRole !== 'headmaster') {
                    alert('Доступ только у деканов и завуча');
                    return;
                }
                if (!students.length) { alert('Нет студентов'); return; }
                document.getElementById('transferModal').classList.add('open');
                document.getElementById('transferStatus').className = 'status-msg';
                renderTransferList();
            });
            document.getElementById('closeTransferBtn').addEventListener('click', function() {
                document.getElementById('transferModal').classList.remove('open');
            });
            document.getElementById('transferCancelBtn').addEventListener('click', function() {
                document.getElementById('transferModal').classList.remove('open');
            });
            document.getElementById('transferModal').addEventListener('click', function(e) {
                if (e.target === this) this.classList.remove('open');
            });
            document.getElementById('transferFacultySelect').addEventListener('change', renderTransferList);
            document.getElementById('transferConfirmBtn').addEventListener('click', async function() {
                const checks = document.querySelectorAll('.student-check:checked');
                if (!checks.length) {
                    document.getElementById('transferStatus').textContent = '❌ Выберите студентов';
                    document.getElementById('transferStatus').className = 'status-msg show error';
                    return;
                }
                const ids = Array.from(checks).map(cb => parseInt(cb.value));
                const newCourse = parseInt(document.getElementById('transferNewCourse').value);
                const count = await transferStudents(ids, newCourse);
                if (count > 0) {
                    document.getElementById('transferStatus').textContent = `✅ Переведено: ${count}`;
                    document.getElementById('transferStatus').className = 'status-msg show success';
                    setTimeout(() => { renderTransferList();
                        document.getElementById('selectAllCheck').checked = false; }, 500);
                } else {
                    document.getElementById('transferStatus').textContent = '❌ Ошибка';
                    document.getElementById('transferStatus').className = 'status-msg show error';
                }
            });

            // Clear faculty
            document.getElementById('clearFacultyBtn').addEventListener('click', function() {
                if (userRole !== 'dean' && userRole !== 'headmaster') {
                    alert('Доступ только у деканов и завуча');
                    return;
                }
                clearFaculty(currentFaculty);
            });

            // Admin
            document.getElementById('adminBtn').addEventListener('click', function() {
                if (userRole !== 'headmaster') { alert('Доступ только у завуча'); return; }
                document.getElementById('adminModal').classList.add('open');
                document.getElementById('adminStatus').className = 'status-msg';
                renderAdminPanel();
            });
            document.getElementById('closeAdminBtn').addEventListener('click', function() {
                document.getElementById('adminModal').classList.remove('open');
            });
            document.getElementById('adminModal').addEventListener('click', function(e) {
                if (e.target === this) this.classList.remove('open');
            });
            document.getElementById('adminAddUserBtn').addEventListener('click', async function() {
                const username = document.getElementById('adminUsername').value.trim();
                const password = document.getElementById('adminPassword').value.trim();
                const role = document.getElementById('adminRole').value;
                const displayName = document.getElementById('adminDisplayName').value.trim() || username;
                if (!username || !password) {
                    document.getElementById('adminStatus').textContent = '❌ Заполните поля';
                    document.getElementById('adminStatus').className = 'status-msg show error';
                    return;
                }
                try {
                    await addUserDB(username, password, role, displayName);
                    document.getElementById('adminStatus').textContent = `✅ Пользователь ${username} добавлен`;
                    document.getElementById('adminStatus').className = 'status-msg show success';
                    document.getElementById('adminUsername').value = '';
                    document.getElementById('adminPassword').value = '';
                    document.getElementById('adminDisplayName').value = '';
                    renderAdminPanel();
                } catch (err) {
                    document.getElementById('adminStatus').textContent = '❌ ' + (err.message || 'Ошибка');
                    document.getElementById('adminStatus').className = 'status-msg show error';
                }
            });

            // Certificate
            document.getElementById('certBtn').addEventListener('click', function() {
                if (currentCourse !== 7) { alert('Аттестат только для 7 курса'); return; }
                if (!students.length) { alert('Нет учеников'); return; }
                document.getElementById('certificateContainer').innerHTML = '';
                document.getElementById('downloadCertBtn').style.display = 'none';
                document.getElementById('certModal').classList.add('open');
                renderCertSelect();
            });
            document.getElementById('closeCertModalBtn').addEventListener('click', function() {
                document.getElementById('certModal').classList.remove('open');
            });
            document.getElementById('certModal').addEventListener('click', function(e) {
                if (e.target === this) this.classList.remove('open');
            });
            document.getElementById('generateCertBtn').addEventListener('click', function() {
                const name = document.getElementById('certStudentSelect').value;
                if (!name) { alert('Выберите ученика'); return; }
                generateCertificate(name);
            });
            document.getElementById('downloadCertBtn').addEventListener('click', downloadCertificate);

            // Report
            document.getElementById('reportBtn').addEventListener('click', function() {
                document.getElementById('reportContainer').innerHTML = generateReport();
                document.getElementById('reportModal').classList.add('open');
            });
            document.getElementById('closeReportBtn').addEventListener('click', function() {
                document.getElementById('reportModal').classList.remove('open');
            });
            document.getElementById('reportModal').addEventListener('click', function(e) {
                if (e.target === this) this.classList.remove('open');
            });
            document.getElementById('exportExcelBtn').addEventListener('click', exportExcel);

            renderAll();
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
