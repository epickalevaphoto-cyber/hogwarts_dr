<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hogwarts Daily</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
    </script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0c0a0f;
            color: #e8e4d8;
            font-family: Arial, sans-serif;
            padding: 20px;
        }

        .app {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            background: rgba(18, 16, 26, 0.85);
            padding: 12px 20px;
            border-radius: 12px;
            border: 1px solid rgba(212, 175, 55, 0.12);
            margin-bottom: 16px;
        }

        .header h1 {
            font-size: 1.3rem;
            color: #d4af37;
        }

        .controls {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            align-items: center;
        }

        .controls button,
        .controls select {
            padding: 6px 14px;
            background: rgba(30, 28, 45, 0.8);
            border: 1px solid rgba(60, 60, 80, 0.25);
            color: #e8e4d8;
            border-radius: 6px;
            font-size: 0.75rem;
            cursor: pointer;
        }

        .btn-gold {
            background: #d4af37 !important;
            color: #0a0a0f !important;
            font-weight: 600;
        }
        .btn-green {
            background: #1a6b47 !important;
            color: #fff !important;
        }
        .btn-outline {
            background: transparent !important;
            border-color: #d4af37 !important;
            color: #d4af37 !important;
        }

        .role-badge {
            font-size: 0.6rem;
            padding: 2px 12px;
            border-radius: 10px;
            background: rgba(212, 175, 55, 0.1);
            color: #d4af37;
            border: 1px solid rgba(212, 175, 55, 0.12);
        }

        .main-grid {
            display: grid;
            grid-template-columns: 200px 1fr;
            gap: 16px;
        }

        .sidebar {
            background: rgba(18, 16, 26, 0.85);
            border-radius: 12px;
            padding: 16px;
            border: 1px solid rgba(60, 60, 80, 0.15);
        }

        .sidebar .title {
            font-size: 0.6rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #555;
            margin-bottom: 10px;
            border-bottom: 1px solid rgba(60, 60, 80, 0.15);
            padding-bottom: 6px;
        }

        .faculty-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            margin-bottom: 2px;
            border-left: 2px solid transparent;
        }

        .faculty-item:hover {
            background: rgba(255, 255, 255, 0.03);
        }

        .faculty-item.active {
            background: rgba(212, 175, 55, 0.05);
            border-left-color: #d4af37;
        }

        .faculty-item .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
        }

        .faculty-item .count {
            margin-left: auto;
            font-size: 0.6rem;
            color: #555;
        }

        .sidebar-actions {
            display: flex;
            flex-direction: column;
            gap: 4px;
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid rgba(60, 60, 80, 0.15);
        }

        .sidebar-actions button {
            padding: 5px 10px;
            border: 1px solid rgba(60, 60, 80, 0.2);
            border-radius: 6px;
            background: rgba(255, 255, 255, 0.02);
            color: #aaa;
            font-size: 0.7rem;
            cursor: pointer;
            text-align: left;
        }

        .sidebar-actions button:hover {
            border-color: #d4af37;
        }

        .journal {
            background: rgba(18, 16, 26, 0.85);
            border-radius: 12px;
            padding: 16px;
            border: 1px solid rgba(60, 60, 80, 0.15);
            overflow-x: auto;
        }

        .journal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.8rem;
            min-width: 600px;
        }

        th {
            text-align: left;
            padding: 6px 4px;
            background: rgba(30, 28, 45, 0.4);
            color: #d4af37;
            font-size: 0.6rem;
            border-bottom: 1px solid rgba(60, 60, 80, 0.2);
        }

        td {
            padding: 4px 4px;
            border-bottom: 1px solid rgba(60, 60, 80, 0.08);
        }

        .faculty-gryffindor {
            background: rgba(174, 0, 0, 0.12) !important;
        }
        .faculty-slytherin {
            background: rgba(26, 107, 71, 0.12) !important;
        }
        .faculty-ravenclaw {
            background: rgba(42, 75, 124, 0.12) !important;
        }
        .faculty-hufflepuff {
            background: rgba(227, 167, 56, 0.12) !important;
        }

        .grade-input {
            width: 30px;
            padding: 2px 4px;
            text-align: center;
            background: rgba(0, 0, 0, 0.25);
            border: 1px solid rgba(60, 60, 80, 0.2);
            border-radius: 4px;
            color: #e8e4d8;
            font-size: 0.8rem;
        }

        .grade-input.readonly {
            background: transparent;
            border: none;
            cursor: default;
        }

        .grade-input.g-5 {
            color: #4caf50;
        }
        .grade-input.g-4 {
            color: #8bc34a;
        }
        .grade-input.g-3 {
            color: #ffb74d;
        }
        .grade-input.g-2 {
            color: #ff9800;
        }
        .grade-input.g-1 {
            color: #ef5350;
        }
        .grade-input.g-0 {
            color: #d32f2f;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.85);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }

        .modal.open {
            display: flex;
        }

        .modal-content {
            background: #1a1828;
            border-radius: 12px;
            padding: 24px;
            max-width: 500px;
            width: 100%;
            border: 1px solid rgba(212, 175, 55, 0.15);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .modal-header h2 {
            color: #d4af37;
            font-size: 1.1rem;
        }

        .modal-header .close-btn {
            background: none;
            border: none;
            font-size: 1.4rem;
            color: #555;
            cursor: pointer;
        }

        .form-group {
            margin-bottom: 10px;
        }

        .form-group label {
            display: block;
            font-size: 0.7rem;
            color: #888;
            margin-bottom: 3px;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 6px 10px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(60, 60, 80, 0.25);
            border-radius: 6px;
            color: #e8e4d8;
            font-size: 0.85rem;
        }

        .form-group textarea {
            min-height: 100px;
            resize: vertical;
        }

        .form-row {
            display: flex;
            gap: 8px;
        }

        .form-row .form-group {
            flex: 1;
        }

        .btn-row {
            display: flex;
            gap: 6px;
            margin-top: 10px;
        }

        .btn-row button {
            padding: 6px 16px;
            border: none;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
        }

        .btn-primary {
            background: #d4af37;
            color: #0a0a0f;
            flex: 1;
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.05);
            color: #888;
            border: 1px solid rgba(60, 60, 80, 0.2);
        }

        .status-msg {
            font-size: 0.75rem;
            padding: 6px 10px;
            border-radius: 6px;
            margin-top: 6px;
            display: none;
        }

        .status-msg.show {
            display: block;
        }
        .status-msg.success {
            color: #4caf50;
            background: rgba(76, 175, 80, 0.08);
        }
        .status-msg.error {
            color: #ef5350;
            background: rgba(239, 83, 80, 0.08);
        }

        .legend {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            font-size: 0.6rem;
            color: #666;
            margin-bottom: 8px;
            padding-bottom: 6px;
            border-bottom: 1px solid rgba(60, 60, 80, 0.1);
        }

        .legend .swatch {
            width: 12px;
            height: 12px;
            border-radius: 3px;
            display: inline-block;
        }

        .sync-status {
            font-size: 0.6rem;
            color: #555;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .online-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            background: #4caf50;
            border-radius: 50%;
        }

        .online-dot.offline {
            background: #ef5350;
        }
    </style>
</head>

                <div class="sidebar-actions">

                    <button class="btn-transfer" id="transferBtn">🔄 Перевод</button>
                    <button class="btn-danger" id="clearBtn" style="color:#ef5350;">🗑️ Очистить</button>
                </div>
            </aside>

            <!-- JOURNAL -->
            <main class="journal">

                    <span id="studentCount">👨‍🎓 0</span>

                <div class="legend" id="legend"></div>

                <div class="table-wrap">

                                <th>Ученик</th>
                                <th>Факультет</th>
                            </tr>
                        </thead>
                        <tbody id="tableBody">
                            <tr>
                                <td colspan="10" style="text-align:center;color:#555;padding:20px;">Загрузка...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </main>
        </div>
    </div>

    <!-- LOGIN MODAL -->
    <div class="modal" id="loginModal">

            const dot = document.getElementById('syncDot');
            const text = document.getElementById('syncText');
            if (dot) dot.className = connected ? 'online-dot' : 'online-dot offline';
            if (text) text.textContent = connected ? 'Online' : 'Offline';
        }

            const map = { 'Гриффиндор': 'faculty-gryffindor', 'Слизерин': 'faculty-slytherin',
                'Когтевран': 'faculty-ravenclaw', 'Пуффендуй': 'faculty-hufflepuff' };
            return map[faculty] || '';
        }

                return false;
            }
        }

        async function deleteStudent(id) {
            try {
                const { error } = await supabase.from('students').delete().eq('id', id);
                if (error) throw error;
                return true;
            } catch (err) {
                console.error('❌ Ошибка удаления:', err);
                return false;
            }
        }

        async function hashPassword(password) {
            const encoder = new TextEncoder();
            const data = encoder.encode(password);
            const hashBuffer = await crypto.subtle.digest('SHA-256', data);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
        }

        async function loginUser(username, password) {
            try {
                const hashed = await hashPassword(password);
                const { data, error } = await supabase.from('users')
                    .select('*')
                    .eq('username', username)
                    .eq('password', hashed)
                    .maybeSingle();
                if (error) throw error;
                return data;
            } catch (err) {
                console.error('❌ Ошибка входа:', err);
                return null;
            }
        }

        // ============================================================
        // RENDER
        // ============================================================
        function renderAll() {
            renderFaculties();
            renderJournal();
            renderLegend();
            renderCertSelect();
            renderTransferList();
            updateUI();
        }

        function renderFaculties() {
            document.querySelectorAll('.faculty-item').forEach(el => {
                const f = el.dataset.faculty;
                const count = students.filter(s => s.faculty === f).length;
                const badge = document.getElementById(`count-${f.toLowerCase()}`);
                if (badge) badge.textContent = count;
                el.classList.toggle('active', f === currentFaculty);
            });
            document.getElementById('courseSelect').value = currentCourse;
        }

        function renderLegend() {
            const container = document.getElementById('legend');
            if (!container) return;
            const grades = currentCourse === 7 ? [5, 4, 3, 2, 1, 0] : [5, 0];
            let html = '';
            grades.forEach(g => {
                const label = currentCourse === 7 ?
                    ['Превосходно', 'Выше ожидаемого', 'Удовлетворительно', 'Слабо', 'Отвратительно', 'Тролль'][5 - g] :
                    (g === 5 ? 'Сдал' : 'Не сдал');
                html +=
                    `<span><span class="swatch" style="background:${GRADE_COLORS[g]};"></span> ${g} — ${label}</span>`;
            });
            container.innerHTML = html;
        }

        function renderJournal() {
            const course = currentCourse;
            const faculty = currentFaculty;
            const subjects = SUBJECTS[course] || SUBJECTS[1];
            const filtered = students.filter(s => s.faculty === faculty && s.course === course);
            const canEdit = userRole === 'professor' || userRole === 'headmaster';

            document.getElementById('journalTitle').textContent = `📖 Журнал: ${course} курс`;
            document.getElementById('studentCount').textContent = `👨‍🎓 ${filtered.length}`;

            const thead = document.getElementById('tableHead');
            let hRow = `<tr><th>Ученик</th><th>Факультет</th>`;
            subjects.forEach(s => { hRow += `<th>${s}</th>`; });
            hRow += `</tr>`;
            thead.innerHTML = hRow;

            const tbody = document.getElementById('tableBody');
            if (!filtered.length) {
                tbody.innerHTML =
                    `<tr><td colspan="${subjects.length + 2}" style="text-align:center;color:#555;padding:20px;">Нет учеников</td></tr>`;
                return;
            }

            let html = '';
            filtered.forEach(student => {
                const fClass = getFacultyClass(student.faculty);
                html += `<tr class="${fClass}">`;
                html += `<td class="student-name">
                            ${student.name}
                            ${(userRole === 'dean' || userRole === 'headmaster') ? `<button class="del-btn" data-id="${student.id}">✕</button>` : ''}
                        </td>`;
                html += `<td class="student-faculty">${student.faculty}</td>`;
                subjects.forEach(sub => {
                    const val = student.grades?.[sub];
                    const has = val !== undefined && val !== null;
                    const display = has ? val : '';
                    const cls = has ? `g-${val}` : '';
                    const readonly = !canEdit ? 'readonly' : '';
                    html +=
                        `<td><input class="grade-input ${cls} ${readonly}" type="text" value="${display}" data-id="${student.id}" data-sub="${sub}" ${readonly ? 'readonly' : ''} placeholder="–"></td>`;
                });
                html += `</tr>`;
            });
            tbody.innerHTML = html;

            // Delete buttons
            if (userRole === 'dean' || userRole === 'headmaster') {
                tbody.querySelectorAll('.del-btn').forEach(btn => {
                    btn.addEventListener('click', async function() {
                        const id = parseInt(this.dataset.id);
                        const student = students.find(s => s.id === id);
                        if (student && confirm(`Удалить "${student.name}"?`)) {
                            if (await deleteStudent(id)) {
                                students = students.filter(s => s.id !== id);
                                renderAll();
                            }
                        }
                    });
                });
            }

            // Grade editing
            if (canEdit) {
                tbody.querySelectorAll('.grade-input:not([readonly])').forEach(input => {
                    input.addEventListener('blur', async function() {
                        const val = this.value.trim();
                        const studentId = parseInt(this.dataset.id);
                        const subject = this.dataset.sub;
                        const student = students.find(s => s.id === studentId);
                        if (!student) return;

                        const available = currentCourse === 7 ? [5, 4, 3, 2, 1, 0] : [5, 0];

                        if (val === '') {
                            delete student.grades[subject];
                        } else {
                            const num = parseInt(val);
                            if (!isNaN(num) && available.includes(num)) {
                                if (!student.grades) student.grades = {};
                                student.grades[subject] = num;
                            } else {
                                const prev = student.grades?.[subject];
                                this.value = prev !== undefined && prev !== null ? prev : '';
                                return;
                            }
                        }
                        await saveStudent(student);
                        renderJournal();
                    });
                    input.addEventListener('keydown', function(e) { if (e.key === 'Enter') this.blur(); });
                });
            }
        }

        function renderCertSelect() {
            const select = document.getElementById('certStudent');
            if (!select) return;
            const val = select.value;
            select.innerHTML = `<option value="">— Выберите ученика —</option>`;
            const seventh = students.filter(s => s.course === 7).sort((a, b) => a.name.localeCompare(b.name));
            seventh.forEach(s => {
                const opt = document.createElement('option');
                opt.value = s.name;
                opt.textContent = `${s.name} (${s.faculty})`;
                select.appendChild(opt);
            });
            if (val && seventh.some(s => s.name === val)) select.value = val;
        }

        function renderTransferList() {
            const faculty = document.getElementById('transferFaculty').value;
            const filtered = students.filter(s => s.faculty === faculty);
            const container = document.getElementById('transferList');
            if (!container) return;

            if (!filtered.length) {
                container.innerHTML = '<div style="color:#555;padding:8px;">Нет студентов</div>';
                return;
            }

            let html = '';
            filtered.forEach(s => {
                html +=
                    `<div><input type="checkbox" class="transfer-check" value="${s.id}"> ${s.name} (${s.course} курс)</div>`;
            });
            container.innerHTML = html;
        }

        function updateUI() {
            const badge = document.getElementById('roleBadge');
            if (badge) {
                badge.textContent = ROLE_NAMES[userRole] || 'Гость';
            }
            document.getElementById('currentRoleDisplay').textContent = ROLE_NAMES[userRole];

            const canManage = userRole === 'dean' || userRole === 'headmaster';
            document.getElementById('addBtn').style.display = canManage ? 'block' : 'none';
            document.getElementById('transferBtn').style.display = canManage ? 'block' : 'none';
            document.getElementById('clearBtn').style.display = canManage ? 'block' : 'none';
        }

        // ============================================================
        // EVENTS
        // ============================================================
        document.addEventListener('DOMContentLoaded', function() {

            // Load data
            loadStudents();

            // Course select
            document.getElementById('courseSelect').addEventListener('change', function() {
                currentCourse = parseInt(this.value);
                renderAll();
            });

            // Faculty select
            document.querySelectorAll('.faculty-item').forEach(el => {
                el.addEventListener('click', function() {
                    currentFaculty = this.dataset.faculty;
                    renderAll();
                });
            });

            // Login
            document.getElementById('loginBtn').addEventListener('click', function() {
                document.getElementById('loginModal').classList.add('open');
            });

            document.getElementById('closeLoginBtn').addEventListener('click', function() {
                document.getElementById('loginModal').classList.remove('open');
            });

            document.getElementById('loginConfirmBtn').addEventListener('click', async function() {
                const username = document.getElementById('loginUsername').value.trim();
                const password = document.getElementById('loginPassword').value;

                if (!username || !password) {
                    document.getElementById('loginError').textContent = '❌ Введите логин и пароль';
                    document.getElementById('loginError').className = 'status-msg show error';
                    return;
                }

                const user = await loginUser(username, password);
                if (user) {
                    userRole = user.role;
                    userName = user.display_name || user.username;
                    document.getElementById('loginModal').classList.remove('open');
                    document.getElementById('loginError').className = 'status-msg';
                    renderAll();
                    alert(`🔓 Добро пожаловать, ${userName}!`);
                } else {
                    document.getElementById('loginError').textContent = '❌ Неверный логин или пароль';
                    document.getElementById('loginError').className = 'status-msg show error';
                }
            });

            document.getElementById('logoutBtn').addEventListener('click', function() {
                userRole = 'guest';
                userName = '';
                document.getElementById('loginModal').classList.remove('open');
                renderAll();
                alert('🚪 Вы вышли');
            });

            // Add students
            document.getElementById('addBtn').addEventListener('click', function() {
                if (userRole !== 'dean' && userRole !== 'headmaster') {
                    alert('Доступ только у деканов и завуча');
                    return;
                }
                document.getElementById('addModal').classList.add('open');
                document.getElementById('addStatus').className = 'status-msg';
            });

            document.getElementById('closeAddBtn').addEventListener('click', function() {
                document.getElementById('addModal').classList.remove('open');
            });

            document.getElementById('addCancelBtn').addEventListener('click', function() {
                document.getElementById('addModal').classList.remove('open');
            });

            document.getElementById('addConfirmBtn').addEventListener('click', async function() {
                const names = document.getElementById('addNames').value;
                const faculty = document.getElementById('addFaculty').value;
                const course = parseInt(document.getElementById('addCourse').value);

                if (!names.trim()) {
                    document.getElementById('addStatus').textContent = '❌ Введите имена';
                    document.getElementById('addStatus').className = 'status-msg show error';
                    return;
                }

                const lines = names.split('\n').filter(l => l.trim());
                let added = 0;
                for (const line of lines) {
                    const name = line.trim();
                    if (!name) continue;
                    if (students.some(s => s.name === name && s.faculty === faculty && s.course === course)) continue;

                    const newStudent = {
                        id: Date.now() + Math.random() * 1000 + added,
                        name: name,
                        faculty: faculty,
                        course: course,
                        grades: {}
                    };

                    if (await saveStudent(newStudent)) {
                        students.push(newStudent);
                        added++;
                    }
                }

                if (added > 0) {
                    document.getElementById('addStatus').textContent = `✅ Добавлено: ${added}`;
                    document.getElementById('addStatus').className = 'status-msg show success';
                    document.getElementById('addNames').value = '';
                    renderAll();
                } else {
                    document.getElementById('addStatus').textContent = '❌ Ошибка или дубликаты';
                    document.getElementById('addStatus').className = 'status-msg show error';
                }
            });

            // Transfer
            document.getElementById('transferBtn').addEventListener('click', function() {
                if (userRole !== 'dean' && userRole !== 'headmaster') {
                    alert('Доступ только у деканов и завуча');
                    return;
                }
                document.getElementById('transferModal').classList.add('open');
                document.getElementById('transferStatus').className = 'status-msg';
                renderTransferList();
            });

            document.getElementById('closeTransferBtn').addEventListener('click', function() {
                document.getElementById('transferModal').classList.remove('open');
            });

            document.getElementById('transferCancelBtn').addEventListener('click', function() {
                document.getElementById('transferModal').classList.remove('open');
            });

            document.getElementById('transferFaculty').addEventListener('change', renderTransferList);

            document.getElementById('transferConfirmBtn').addEventListener('click', async function() {
                const checks = document.querySelectorAll('.transfer-check:checked');
                if (!checks.length) {
                    document.getElementById('transferStatus').textContent = '❌ Выберите студентов';
                    document.getElementById('transferStatus').className = 'status-msg show error';
                    return;
                }

                const newCourse = parseInt(document.getElementById('transferCourse').value);
                let transferred = 0;

                for (const check of checks) {
                    const id = parseInt(check.value);
                    const student = students.find(s => s.id === id);
                    if (!student || student.course === newCourse) continue;
                    student.course = newCourse;
                    student.grades = {};
                    if (await saveStudent(student)) transferred++;
                }

                if (transferred > 0) {
                    document.getElementById('transferStatus').textContent = `✅ Переведено: ${transferred}`;
                    document.getElementById('transferStatus').className = 'status-msg show success';
                    renderAll();
                } else {
                    document.getElementById('transferStatus').textContent = '❌ Ошибка';
                    document.getElementById('transferStatus').className = 'status-msg show error';
                }
            });

            // Clear faculty
            document.getElementById('clearBtn').addEventListener('click', async function() {
                if (userRole !== 'dean' && userRole !== 'headmaster') {
                    alert('Доступ только у деканов и завуча');
                    return;
                }
                const toDel = students.filter(s => s.faculty === currentFaculty);
                if (!toDel.length) { alert('Нет студентов'); return; }
                if (!confirm(`Удалить всех с ${currentFaculty}?`)) return;

                let deleted = 0;
                for (const s of toDel) {
                    if (await deleteStudent(s.id)) deleted++;
                }
                if (deleted > 0) {
                    students = students.filter(s => s.faculty !== currentFaculty);
                    renderAll();
                }
            });

            // Certificate
            document.getElementById('certBtn').addEventListener('click', function() {
                if (currentCourse !== 7) { alert('Аттестат только для 7 курса'); return; }
                document.getElementById('certModal').classList.add('open');
                renderCertSelect();
            });

            document.getElementById('closeCertBtn').addEventListener('click', function() {
                document.getElementById('certModal').classList.remove('open');
            });

            document.getElementById('generateCertBtn').addEventListener('click', function() {
                const name = document.getElementById('certStudent').value;
                if (!name) { alert('Выберите ученика'); return; }
                generateCertificate(name);
            });

            // Report
            document.getElementById('reportBtn').addEventListener('click', function() {
                document.getElementById('reportContainer').innerHTML = generateReport();
                document.getElementById('reportModal').classList.add('open');
            });

            document.getElementById('closeReportBtn').addEventListener('click', function() {
                document.getElementById('reportModal').classList.remove('open');
            });

            document.getElementById('exportBtn').addEventListener('click', exportExcel);
        });

        // ============================================================
        // CERTIFICATE
        // ============================================================
        function generateCertificate(name) {
            const student = students.find(s => s.name === name);
            if (!student) { alert('Ученик не найден'); return; }

            const subs = SUBJECTS[7];
            const order = ['Заклинания', 'Зельеварение', 'ЗоТИ', 'История магии', 'Маггловедение',
                'Полеты на метле', 'Прорицание', 'Травология', 'Трансфигурация', 'УЗМС'
            ];
            const display = order.filter(s => subs.includes(s));
            const deanName = student.faculty === 'Гриффиндор' ? 'Минерва МакГонагалл' :
                student.faculty === 'Слизерин' ? 'Северус Снейп' :
                student.faculty === 'Когтевран' ? 'Филиус Флитвик' : 'Помона Стебль';

            let html = `
                <div style="background:#f5e6c8;padding:24px;border-radius:14px;border:2px solid #d4af37;color:#1a1a1a;max-width:660px;margin:0 auto;">
                    <div style="font-family:'Cinzel Decorative',serif;font-size:1.2rem;text-align:center;border-bottom:2px solid #b8860b;padding-bottom:6px;">HOGWARTS SCHOOL OF<br>WITCHCRAFT AND WIZARDRY</div>
                    <div style="text-align:center;font-size:1.4rem;font-weight:700;letter-spacing:4px;color:#b8860b;margin:4px 0;">CERTIFICATE OF COMPLETION</div>
                    <div style="text-align:center;font-size:1.6rem;font-weight:700;margin:4px 0 10px;border-bottom:1px dashed #b8860b;padding-bottom:6px;">${name.toUpperCase()}</div>
                    <div style="display:grid;grid-template-columns:1fr 1fr;gap:2px 20px;font-size:0.9rem;margin:8px 0 12px;">`;

            display.forEach(sub => {
                const v = student.grades?.[sub];
                const text = (v !== undefined && v !== null) ?
                    ['Превосходно', 'Выше ожидаемого', 'Удовлетворительно', 'Слабо', 'Отвратительно', 'Тролль'][5 - v] :
                    'Не сдано';
                html +=
                    `<div style="display:flex;justify-content:space-between;padding:2px 0;border-bottom:1px dotted rgba(0,0,0,0.06);">
                        <span style="font-weight:500;">${sub}</span>
                        <span style="font-weight:700;color:#b8860b;">${text}</span>
                    </div>`;
            });

            const now = new Date();
            const months = ['JANUARY', 'FEBRUARY', 'MARCH', 'APRIL', 'MAY', 'JUNE', 'JULY', 'AUGUST', 'SEPTEMBER', 'OCTOBER',
                'NOVEMBER', 'DECEMBER'
            ];
            const dateStr = `${now.getDate()} ${months[now.getMonth()]}, ${now.getFullYear()}`;

            html += `
                    </div>
                    <div style="display:flex;justify-content:space-between;align-items:flex-end;margin-top:10px;padding-top:6px;border-top:2px solid #b8860b;font-size:0.7rem;">
                        <div>
                            <div style="font-weight:700;font-size:0.6rem;color:#4a4a4a;">ДЕКАН ФАКУЛЬТЕТА</div>
                            <div style="font-weight:600;">${deanName}</div>
                            <div style="font-size:0.6rem;color:#666;">${student.faculty}</div>
                        </div>
                        <div style="text-align:right;">
                            <div style="font-weight:600;">${dateStr}</div>
                            <div style="font-weight:700;font-size:0.6rem;color:#4a4a4a;">ДИРЕКТОР</div>
                            <div style="font-weight:600;">Лана МакДауэлл</div>
                            <div style="font-size:0.6rem;color:#666;">Директор</div>
                        </div>
                    </div>
                </div>`;

            document.getElementById('certContainer').innerHTML = html;
            document.getElementById('downloadCertBtn').style.display = 'block';
        }

        // ============================================================
        // REPORT
        // ============================================================
        function generateReport() {
            const grouped = {};
            students.forEach(s => {
                const c = s.course || '?';
                if (!grouped[c]) grouped[c] = [];
                grouped[c].push(s);
            });

            const sorted = Object.keys(grouped).sort((a, b) => {
                if (a === '?') return 1;
                if (b === '?') return -1;
                return parseInt(a) - parseInt(b);
            });

            let html = '';
            sorted.forEach(c => {
                const list = grouped[c];
                const subs = SUBJECTS[parseInt(c)] || SUBJECTS[1];
                html += `<h3 style="color:#d4af37;margin:12px 0 6px;">${c} курс (${subs.length} предметов)</h3>
                        <table style="font-size:0.7rem;width:100%;border-collapse:collapse;">
                        <thead><tr><th>Ученик</th><th>Факультет</th>`;
                subs.forEach(s => { html += `<th>${s}</th>`; });
                html += `<th>Сумма</th></tr></thead><tbody>`;

                list.forEach(st => {
                    const fClass = getFacultyClass(st.faculty);
                    html += `<tr class="${fClass}"><td><strong>${st.name}</strong></td><td style="color:#666;font-size:0.6rem;">${st.faculty}</td>`;
                    let sum = 0;
                    subs.forEach(sub => {
                        const v = st.grades?.[sub];
                        const has = v !== undefined && v !== null;
                        html +=
                            `<td style="text-align:center;font-weight:600;color:${has ? GRADE_COLORS[v] || '#e8e4d8' : '#555'};">${has ? v : ''}</td>`;
                        if (has) sum += v;
                    });
                    html += `<td style="font-weight:700;color:#d4af37;text-align:center;">${sum}</td></tr>`;
                });
                html += `</tbody></table>`;
            });

            if (!Object.keys(grouped).length) html = '<p style="color:#555;text-align:center;padding:20px;">Нет данных</p>';
            return html;
        }

        function exportExcel() {
            try {
                const grouped = {};
                students.forEach(s => {
                    const c = s.course || '?';
                    if (!grouped[c]) grouped[c] = [];
                    grouped[c].push(s);
                });

                let html =
                    `<html><head><meta charset="UTF-8"><style>table{border-collapse:collapse;font-family:Arial;font-size:12px;}th{background:#d4af37;padding:6px 8px;border:1px solid #000;}td{padding:4px 8px;border:1px solid #999;}.course-title{font-size:16px;font-weight:bold;padding:10px 0;}</style></head><body>`;
                for (let c = 1; c <= 7; c++) {
                    const list = grouped[c] || [];
                    const subjects = SUBJECTS[c] || [];
                    html += `<div class="course-title">${c} курс</div><table><tr><th>Ученик</th><th>Факультет</th>`;
                    subjects.forEach(s => { html += `<th>${s}</th>`; });
                    html += `<th>Сумма</th></tr>`;
                    if (!list.length) {
                        html += `<tr><td colspan="${subjects.length + 3}" style="text-align:center;color:#999;">Нет студентов</td></tr>`;
                    } else {
                        list.forEach(st => {
                            html += `<tr><td>${st.name}</td><td>${st.faculty}</td>`;
                            let sum = 0;
                            subjects.forEach(sub => {
                                const v = st.grades?.[sub];
                                const val = (v !== undefined && v !== null) ? v : '';
                                html += `<td style="text-align:center;">${val}</td>`;
                                if (val) sum += parseInt(val);
                            });
                            html += `<td style="text-align:center;font-weight:bold;color:#b8860b;">${sum}</td></tr>`;
                        });
                    }
                    html += `</table><br>`;
                }
                html += `</body></html>`;

                const blob = new Blob([html], { type: 'application/vnd.ms-excel' });
                const link = document.createElement('a');
                link.href = URL.createObjectURL(blob);
                link.download = `HogwartsDaily_${new Date().toISOString().slice(0, 10)}.xls`;
                link.click();
                alert('✅ Excel скачан!');
            } catch (err) { alert('❌ Ошибка: ' + err.message); }
        }
    </script>
