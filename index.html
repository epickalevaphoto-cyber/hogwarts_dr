<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hogwarts Daily</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
    </script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0c0a0f;
            color: #e8e4d8;
            font-family: Arial, sans-serif;
            padding: 20px;
        }

        .app {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            background: rgba(18, 16, 26, 0.85);
            padding: 12px 20px;
            border-radius: 12px;
            border: 1px solid rgba(212, 175, 55, 0.12);
            margin-bottom: 16px;
        }

        .header h1 {
            font-size: 1.3rem;
            color: #d4af37;
        }

        .controls {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            align-items: center;
        }

        .controls button,
        .controls select {
            padding: 6px 14px;
            background: rgba(30, 28, 45, 0.8);
            border: 1px solid rgba(60, 60, 80, 0.25);
            color: #e8e4d8;
            border-radius: 6px;
            font-size: 0.75rem;
            cursor: pointer;
        }

        .btn-gold {
            background: #d4af37 !important;
            color: #0a0a0f !important;
            font-weight: 600;
        }
        .btn-green {
            background: #1a6b47 !important;
            color: #fff !important;
        }
        .btn-outline {
            background: transparent !important;
            border-color: #d4af37 !important;
            color: #d4af37 !important;
        }
        .btn-blue {
            background: #0d47a1 !important;
            color: #fff !important;
        }

        .role-badge {
            font-size: 0.6rem;
            padding: 2px 12px;
            border-radius: 10px;
            background: rgba(212, 175, 55, 0.1);
            color: #d4af37;
            border: 1px solid rgba(212, 175, 55, 0.12);
        }

        .role-badge.guest {
            background: rgba(255, 255, 255, 0.03);
            color: #555566;
            border-color: rgba(255, 255, 255, 0.05);
        }

        .main-grid {
            display: grid;
            grid-template-columns: 200px 1fr;
            gap: 16px;
        }

        .sidebar {
            background: rgba(18, 16, 26, 0.85);
            border-radius: 12px;
            padding: 16px;
            border: 1px solid rgba(60, 60, 80, 0.15);
        }

        .sidebar .title {
            font-size: 0.6rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #555;
            margin-bottom: 10px;
            border-bottom: 1px solid rgba(60, 60, 80, 0.15);
            padding-bottom: 6px;
        }

        .faculty-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            margin-bottom: 2px;
            border-left: 2px solid transparent;
        }

        .faculty-item:hover {
            background: rgba(255, 255, 255, 0.03);
        }

        .faculty-item.active {
            background: rgba(212, 175, 55, 0.05);
            border-left-color: #d4af37;
        }

        .faculty-item .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
        }

        .faculty-item .count {
            margin-left: auto;
            font-size: 0.6rem;
            color: #555;
        }

        .sidebar-actions {
            display: flex;
            flex-direction: column;
            gap: 4px;
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid rgba(60, 60, 80, 0.15);
        }

        .sidebar-actions button {
            padding: 5px 10px;
            border: 1px solid rgba(60, 60, 80, 0.2);
            border-radius: 6px;
            background: rgba(255, 255, 255, 0.02);
            color: #aaa;
            font-size: 0.7rem;
            cursor: pointer;
            text-align: left;
        }

        .sidebar-actions button:hover {
            border-color: #d4af37;
        }

        .journal {
            background: rgba(18, 16, 26, 0.85);
            border-radius: 12px;
            padding: 16px;
            border: 1px solid rgba(60, 60, 80, 0.15);
            overflow-x: auto;
        }

        .journal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.8rem;
            min-width: 600px;
        }

        th {
            text-align: left;
            padding: 6px 4px;
            background: rgba(30, 28, 45, 0.4);
            color: #d4af37;
            font-size: 0.6rem;
            border-bottom: 1px solid rgba(60, 60, 80, 0.2);
        }

        td {
            padding: 4px 4px;
            border-bottom: 1px solid rgba(60, 60, 80, 0.08);
        }

        .faculty-gryffindor {
            background: rgba(174, 0, 0, 0.12) !important;
        }
        .faculty-slytherin {
            background: rgba(26, 107, 71, 0.12) !important;
        }
        .faculty-ravenclaw {
            background: rgba(42, 75, 124, 0.12) !important;
        }
        .faculty-hufflepuff {
            background: rgba(227, 167, 56, 0.12) !important;
        }

        .grade-input {
            width: 30px;
            padding: 2px 4px;
            text-align: center;
            background: rgba(0, 0, 0, 0.25);
            border: 1px solid rgba(60, 60, 80, 0.2);
            border-radius: 4px;
            color: #e8e4d8;
            font-size: 0.8rem;
        }

        .grade-input.readonly {
            background: transparent;
            border: none;
            cursor: default;
        }

        .grade-input.g-5 {
            color: #4caf50;
        }
        .grade-input.g-4 {
            color: #8bc34a;
        }
        .grade-input.g-3 {
            color: #ffb74d;
        }
        .grade-input.g-2 {
            color: #ff9800;
        }
        .grade-input.g-1 {
            color: #ef5350;
        }
        .grade-input.g-0 {
            color: #d32f2f;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.85);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }

        .modal.open {
            display: flex;
        }

        .modal-content {
            background: #1a1828;
            border-radius: 12px;
            padding: 24px;
            max-width: 500px;
            width: 100%;
            border: 1px solid rgba(212, 175, 55, 0.15);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .modal-header h2 {
            color: #d4af37;
            font-size: 1.1rem;
        }

        .modal-header .close-btn {
            background: none;
            border: none;
            font-size: 1.4rem;
            color: #555;
            cursor: pointer;
        }

        .form-group {
            margin-bottom: 10px;
        }

        .form-group label {
            display: block;
            font-size: 0.7rem;
            color: #888;
            margin-bottom: 3px;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 6px 10px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(60, 60, 80, 0.25);
            border-radius: 6px;
            color: #e8e4d8;
            font-size: 0.85rem;
        }

        .form-group textarea {
            min-height: 100px;
            resize: vertical;
        }

        .form-row {
            display: flex;
            gap: 8px;
        }

        .form-row .form-group {
            flex: 1;
        }

        .btn-row {
            display: flex;
            gap: 6px;
            margin-top: 10px;
        }

        .btn-row button {
            padding: 6px 16px;
            border: none;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
        }

        .btn-primary {
            background: #d4af37;
            color: #0a0a0f;
            flex: 1;
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.05);
            color: #888;
            border: 1px solid rgba(60, 60, 80, 0.2);
        }

        .status-msg {
            font-size: 0.75rem;
            padding: 6px 10px;
            border-radius: 6px;
            margin-top: 6px;
            display: none;
        }

        .status-msg.show {
            display: block;
        }
        .status-msg.success {
            color: #4caf50;
            background: rgba(76, 175, 80, 0.08);
        }
        .status-msg.error {
            color: #ef5350;
            background: rgba(239, 83, 80, 0.08);
        }

        .legend {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            font-size: 0.6rem;
            color: #666;
            margin-bottom: 8px;
            padding-bottom: 6px;
            border-bottom: 1px solid rgba(60, 60, 80, 0.1);
        }

        .legend .swatch {
            width: 12px;
            height: 12px;
            border-radius: 3px;
            display: inline-block;
        }

        .sync-status {
            font-size: 0.6rem;
            color: #555;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .online-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            background: #4caf50;
            border-radius: 50%;
        }

        .online-dot.offline {
            background: #ef5350;
        }

        /* Admin panel */
        .user-list {
            max-height: 200px;
            overflow-y: auto;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 6px;
            padding: 6px;
        }
        .user-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 4px 6px;
            border-bottom: 1px solid rgba(60, 60, 80, 0.08);
            font-size: 0.8rem;
        }
        .user-item .user-role {
            font-size: 0.6rem;
            padding: 2px 8px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.05);
        }
        .user-item .user-del {
            background: none;
            border: none;
            color: #555;
            cursor: pointer;
            font-size: 0.8rem;
        }
        .user-item .user-del:hover {
            color: #ef5350;
        }
        .user-role-headmaster {
            color: #d4af37;
            border: 1px solid rgba(212, 175, 55, 0.2);
        }
        .user-role-dean {
            color: #ffb74d;
            border: 1px solid rgba(255, 183, 77, 0.2);
        }
        .user-role-professor {
            color: #4caf50;
            border: 1px solid rgba(76, 175, 80, 0.2);
        }
    </style>
</head>
<body>

    <div class="app">
        <!-- HEADER -->
        <header class="header">
            <h1>🏰 HOGWARTS DAILY</h1>
            <div class="controls">
                <select id="courseSelect">
                    <option value="1">1 курс</option>
                    <option value="2">2 курс</option>
                    <option value="3">3 курс</option>
                    <option value="4">4 курс</option>
                    <option value="5">5 курс</option>
                    <option value="6">6 курс</option>
                    <option value="7" selected>7 курс</option>
                </select>
                <button class="btn-gold" id="loginBtn">🔑 Войти</button>
                <button class="btn-outline" id="certBtn">🏆 Аттестат</button>
                <button class="btn-green" id="reportBtn">📊 Отчет</button>
                <button class="btn-blue" id="adminBtn" style="display:none;">⚙️ Админ</button>
                <span class="role-badge guest" id="roleBadge">Гость</span>
                <span class="sync-status">
                    <span class="online-dot offline" id="syncDot"></span>
                    <span id="syncText">Offline</span>
                </span>
            </div>
        </header>

        <!-- MAIN -->
        <div class="main-grid">
            <!-- SIDEBAR -->
            <aside class="sidebar">
                <div class="title">ФАКУЛЬТЕТЫ</div>
                <div id="facultyList">
                    <div class="faculty-item active" data-faculty="Гриффиндор">
                        <span class="dot" style="background:#ae0000;"></span> Гриффиндор
                        <span class="count" id="count-gryffindor">0</span>
                    </div>
                    <div class="faculty-item" data-faculty="Слизерин">
                        <span class="dot" style="background:#1a6b47;"></span> Слизерин
                        <span class="count" id="count-slytherin">0</span>
                    </div>
                    <div class="faculty-item" data-faculty="Когтевран">
                        <span class="dot" style="background:#2a4b7c;"></span> Когтевран
                        <span class="count" id="count-ravenclaw">0</span>
                    </div>
                    <div class="faculty-item" data-faculty="Пуффендуй">
                        <span class="dot" style="background:#e3a738;"></span> Пуффендуй
                        <span class="count" id="count-hufflepuff">0</span>
                    </div>
                </div>

                <div class="sidebar-actions">
                    <button class="btn-add" id="addBtn">➕ Добавить</button>
                    <button class="btn-transfer" id="transferBtn">🔄 Перевод</button>
                    <button class="btn-danger" id="clearBtn" style="color:#ef5350;">🗑️ Очистить</button>
                </div>
            </aside>

            <!-- JOURNAL -->
            <main class="journal">
                <div class="journal-header">
                    <h2 id="journalTitle">📖 Журнал: 7 курс</h2>
                    <span id="studentCount">👨‍🎓 0</span>
                </div>

                <div class="legend" id="legend"></div>

                <div class="table-wrap">
                    <table>
                        <thead id="tableHead">
                            <tr>
                                <th>Ученик</th>
                                <th>Факультет</th>
                            </tr>
                        </thead>
                        <tbody id="tableBody">
                            <tr>
                                <td colspan="10" style="text-align:center;color:#555;padding:20px;">Загрузка...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </main>
        </div>
    </div>

    <!-- LOGIN MODAL -->
    <div class="modal" id="loginModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>🔐 Вход</h2>
                <button class="close-btn" id="closeLoginBtn">✕</button>
            </div>
            <div class="form-group">
                <label>Логин</label>
                <input type="text" id="loginUsername" placeholder="Введите логин">
            </div>
            <div class="form-group">
                <label>Пароль</label>
                <input type="password" id="loginPassword" placeholder="Введите пароль">
            </div>
            <div class="status-msg" id="loginError"></div>
            <div class="btn-row">
                <button class="btn-primary" id="loginConfirmBtn">🔑 Войти</button>
                <button class="btn-secondary" id="logoutBtn">🚪 Выйти</button>
            </div>
            <div style="margin-top:8px;font-size:0.6rem;color:#555;text-align:center;">
                Текущая роль: <span id="currentRoleDisplay">Гость</span>
            </div>
        </div>
    </div>

    <!-- ADD MODAL -->
    <div class="modal" id="addModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>➕ Добавить студентов</h2>
                <button class="close-btn" id="closeAddBtn">✕</button>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>Курс</label>
                    <select id="addCourse">
                        <option value="1">1</option>
                        <option value="2">2</option>
                        <option value="3">3</option>
                        <option value="4">4</option>
                        <option value="5">5</option>
                        <option value="6">6</option>
                        <option value="7" selected>7</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Факультет</label>
                    <select id="addFaculty">
                        <option value="Гриффиндор">Гриффиндор</option>
                        <option value="Слизерин">Слизерин</option>
                        <option value="Когтевран">Когтевран</option>
                        <option value="Пуффендуй">Пуффендуй</option>
                    </select>
                </div>
            </div>
            <div class="form-group">
                <label>Список студентов</label>
                <textarea id="addNames" placeholder="Поттер Гарри&#10;Грейнджер Гермиона"></textarea>
            </div>
            <div class="status-msg" id="addStatus"></div>
            <div class="btn-row">
                <button class="btn-primary" id="addConfirmBtn">📥 Добавить</button>
                <button class="btn-secondary" id="addCancelBtn">Отмена</button>
            </div>
        </div>
    </div>

    <!-- TRANSFER MODAL -->
    <div class="modal" id="transferModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>🔄 Перевод</h2>
                <button class="close-btn" id="closeTransferBtn">✕</button>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>С факультета</label>
                    <select id="transferFaculty">
                        <option value="Гриффиндор">Гриффиндор</option>
                        <option value="Слизерин">Слизерин</option>
                        <option value="Когтевран">Когтевран</option>
                        <option value="Пуффендуй">Пуффендуй</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>На курс</label>
                    <select id="transferCourse">
                        <option value="1">1</option>
                        <option value="2">2</option>
                        <option value="3">3</option>
                        <option value="4">4</option>
                        <option value="5">5</option>
                        <option value="6">6</option>
                        <option value="7">7</option>
                    </select>
                </div>
            </div>
            <div class="form-group">
                <label>Студенты</label>
                <div id="transferList" style="max-height:150px;overflow-y:auto;background:rgba(0,0,0,0.2);padding:6px;border-radius:6px;"></div>
            </div>
            <div class="status-msg" id="transferStatus"></div>
            <div class="btn-row">
                <button class="btn-primary" id="transferConfirmBtn">🔄 Перевести</button>
                <button class="btn-secondary" id="transferCancelBtn">Отмена</button>
            </div>
        </div>
    </div>

    <!-- ADMIN MODAL -->
    <div class="modal" id="adminModal">
        <div class="modal-content" style="max-width:500px;">
            <div class="modal-header">
                <h2>⚙️ Админ-панель</h2>
                <button class="close-btn" id="closeAdminBtn">✕</button>
            </div>
            <div class="form-group">
                <label>Новый пользователь</label>
                <div class="form-row">
                    <input type="text" id="adminUsername" placeholder="Логин" style="flex:1;">
                    <input type="text" id="adminPassword" placeholder="Пароль" style="flex:1;">
                </div>
                <div class="form-row" style="margin-top:4px;">
                    <select id="adminRole" style="flex:1;">
                        <option value="professor">Профессор</option>
                        <option value="dean">Декан</option>
                        <option value="headmaster">Завуч</option>
                    </select>
                    <input type="text" id="adminDisplayName" placeholder="Имя" style="flex:1;">
                </div>
                <button class="btn-primary" id="adminAddBtn" style="width:100%;margin-top:4px;">➕ Добавить</button>
            </div>
            <div class="status-msg" id="adminStatus"></div>
            <div class="form-group">
                <label>Пользователи</label>
                <div class="user-list" id="userList">
                    <div style="color:#555;padding:10px;">Загрузка...</div>
                </div>
            </div>
        </div>
    </div>

    <!-- CERTIFICATE MODAL -->
    <div class="modal" id="certModal">
        <div class="modal-content" style="max-width:700px;">
            <div class="modal-header">
                <h2>🏆 Аттестат</h2>
                <button class="close-btn" id="closeCertBtn">✕</button>
            </div>
            <div class="form-group">
                <select id="certStudent" style="width:100%;padding:6px 10px;background:rgba(0,0,0,0.3);border:1px solid rgba(60,60,80,0.25);border-radius:6px;color:#e8e4d8;">
                    <option value="">— Выберите ученика —</option>
                </select>
            </div>
            <button class="btn-primary" id="generateCertBtn" style="width:100%;">📜 Сгенерировать</button>
            <div id="certContainer" style="margin-top:12px;"></div>
            <button class="btn-green" id="downloadCertBtn" style="display:none;width:100%;margin-top:8px;">📥 Скачать PNG</button>
        </div>
    </div>

    <!-- REPORT MODAL -->
    <div class="modal" id="reportModal">
        <div class="modal-content" style="max-width:90vw;">
            <div class="modal-header">
                <h2>📊 Отчет</h2>
                <button class="close-btn" id="closeReportBtn">✕</button>
            </div>
            <div id="reportContainer"></div>
            <div class="btn-row">
                <button class="btn-primary" id="exportBtn">📥 Экспорт Excel</button>
            </div>
        </div>
    </div>

            3: ['Заклинания', 'Трансфигурация', 'Зельеварение', 'История магии', 'Травология', 'ЗоТИ', 'Маггловедение',
                'УЗМС', 'Прорицание'
            ],
            4: ['Заклинания', 'Трансфигурация', 'Зельеварение', 'История магии', 'Травология', 'ЗоТИ', 'Маггловедение',
                'УЗМС', 'Прорицание'
            ],
            5: ['Заклинания', 'Трансфигурация', 'Зельеварение', 'История магии', 'Травология', 'ЗоТИ', 'Маггловедение',
                'УЗМС', 'Прорицание'
            ],
            6: ['Заклинания', 'Трансфигурация', 'Зельеварение', 'История магии', 'Травология', 'ЗоТИ', 'Маггловедение',
                'УЗМС', 'Прорицание'
            ],
            7: ['Заклинания', 'Трансфигурация', 'Зельеварение', 'История магии', 'Травология', 'ЗоТИ', 'Маггловедение',
                'Полеты на метле', 'Прорицание', 'УЗМС'
            ]
        };
        const GRADE_COLORS = { 5: '#4caf50', 4: '#8bc34a', 3: '#ffb74d', 2: '#ff9800', 1: '#ef5350', 0: '#d32f2f' };
        const ROLE_NAMES = { guest: 'Гость', professor: 'Профессор', dean: 'Декан', headmaster: 'Завуч' };
        const DEANS = { 'Гриффиндор': 'Минерва МакГонагалл', 'Слизерин': 'Северус Снейп', 'Когтевран': 'Филиус Флитвик',
            'Пуффендуй': 'Помона Стебль' };
        const DIRECTOR = 'Лана МакДауэлл';

        // ============================================================
        // STATE
        // ============================================================
        let students = [];
        let currentCourse = 7;
        let currentFaculty = 'Гриффиндор';
        let userRole = 'guest';
        let userName = '';

        // ============================================================
        // UTILITY
        // ============================================================
        function $(id) { return document.getElementById(id); }

        function showStatus(id, msg, type) {
            const el = $(id);
            if (!el) return;
            el.textContent = msg;
            el.className = 'status-msg show ' + type;
            setTimeout(() => { if (el) el.className = 'status-msg'; }, 3000);
        }

        function getFacultyClass(faculty) {
            const map = { 'Гриффиндор': 'faculty-gryffindor', 'Слизерин': 'faculty-slytherin',
                'Когтевран': 'faculty-ravenclaw', 'Пуффендуй': 'faculty-hufflepuff' };
            return map[faculty] || '';
        }

        function setSync(text, online) {
            const dot = $('syncDot');
            const syncText = $('syncText');
            if (dot) dot.className = online ? 'online-dot' : 'online-dot offline';
            if (syncText) syncText.textContent = text;
        }

        // ============================================================
        // SHA-256
        // ============================================================
        async function sha256(text) {
            const bytes = new TextEncoder().encode(text);
            const hash = await crypto.subtle.digest('SHA-256', bytes);
            return [...new Uint8Array(hash)].map(b => b.toString(16).padStart(2, '0')).join('');
        }

        // ============================================================
        // SUPABASE OPERATIONS
        // ============================================================
        async function loadStudents() {
            try {
                const { data, error } = await db.from('students').select('*').order('name');
                if (error) throw error;
                students = data || [];
                setSync(students.length + ' студентов', true);
                renderAll();
                return data;
            } catch (err) {
                console.error(err);
                setSync('Ошибка', false);
                return null;
            }
        }

        async function saveStudent(student) {
            try {
                const { error } = await db.from('students').upsert(student);
                if (error) throw error;
                return true;
            } catch (err) {
                console.error(err);
                return false;
            }
        }

        async function deleteStudent(id) {
            try {
                const { error } = await db.from('students').delete().eq('id', id);
                if (error) throw error;
                return true;
            } catch (err) {
                console.error(err);
                return false;
            }
        }

        async function loadUsers() {
            try {
                const { data, error } = await db.from('users').select('*').order('id');
                if (error) throw error;
                return data;
            } catch (err) {
                console.error(err);
                return [];
            }
        }

        async function addUserDB(username, password, role, displayName) {
            const hashed = await sha256(password);
            const { error } = await db.from('users').insert({
                username,
                password: hashed,
                role,
                display_name: displayName || username
            });
            if (error) throw error;
        }

        async function deleteUserDB(id) {
            const { error } = await db.from('users').delete().eq('id', id);
            if (error) throw error;
        }

        // ============================================================
        // RENDER
        // ============================================================
        function renderAll() {
            renderFaculties();
            renderLegend();
            renderJournal();
            renderCertSelect();
            renderTransferList();
            updateUI();
        }

        function renderFaculties() {
            document.querySelectorAll('.faculty-item').forEach(el => {
                const f = el.dataset.faculty;
                const count = students.filter(s => s.faculty === f).length;
                const badge = $(`count-${f.toLowerCase()}`);
                if (badge) badge.textContent = count;
                el.classList.toggle('active', f === currentFaculty);
            });
            $('courseSelect').value = currentCourse;
        }

        function renderLegend() {
            const box = $('legend');
            if (!box) return;
            const grades = currentCourse === 7 ? [5, 4, 3, 2, 1, 0] : [5, 0];
            box.innerHTML = grades.map(g =>
                `<span><span class="swatch" style="background:${GRADE_COLORS[g]}"></span> ${g}</span>`
            ).join('');
        }

        function renderJournal() {
            const subjects = SUBJECTS[currentCourse] || SUBJECTS[1];
            const filtered = students.filter(s => s.faculty === currentFaculty && s.course === currentCourse);
            const canEdit = userRole === 'professor' || userRole === 'headmaster';

            $('journalTitle').textContent = `📖 Журнал: ${currentCourse} курс`;
            $('studentCount').textContent = `👨‍🎓 ${filtered.length}`;

            const thead = $('tableHead');
            thead.innerHTML =
                `<tr><th>Ученик</th><th>Факультет</th>${subjects.map(s => `<th>${s}</th>`).join('')}</tr>`;

            const tbody = $('tableBody');
            if (!filtered.length) {
                tbody.innerHTML =
                    `<tr><td colspan="${subjects.length + 2}" style="text-align:center;color:#555;padding:20px;">Нет учеников</td></tr>`;
                return;
            }

            tbody.innerHTML = filtered.map(s => `
                    <tr class="${getFacultyClass(s.faculty)}">
                        <td class="student-name">
                            ${s.name}
                            ${(userRole === 'dean' || userRole === 'headmaster') ? `<button class="del-btn" data-id="${s.id}">✕</button>` : ''}
                        </td>
                        <td class="student-faculty">${s.faculty}</td>
                        ${subjects.map(sub => {
                            const val = s.grades?.[sub];
                            const has = val !== undefined && val !== null;
                            const display = has ? val : '';
                            const cls = has ? `g-${val}` : '';
                            const readonly = !canEdit ? 'readonly' : '';
                            return `<td><input class="grade-input ${cls} ${readonly}" type="text" value="${display}" data-id="${s.id}" data-sub="${sub}" ${readonly ? 'readonly' : ''} placeholder="–"></td>`;
                        }).join('')}
                    </tr>
                `).join('');

            // Delete buttons
            if (userRole === 'dean' || userRole === 'headmaster') {
                tbody.querySelectorAll('.del-btn').forEach(btn => {
                    btn.addEventListener('click', async function() {
                        const id = parseInt(this.dataset.id);
                        const student = students.find(s => s.id === id);
                        if (student && confirm(`Удалить "${student.name}"?`)) {
                            if (await deleteStudent(id)) {
                                students = students.filter(s => s.id !== id);
                                renderAll();
                            }
                        }
                    });
                });
            }

            // Grade editing
            if (canEdit) {
                tbody.querySelectorAll('.grade-input:not([readonly])').forEach(input => {
                    input.addEventListener('blur', async function() {
                        const val = this.value.trim();
                        const id = parseInt(this.dataset.id);
                        const sub = this.dataset.sub;
                        const student = students.find(s => s.id === id);
                        if (!student) return;

                        const available = currentCourse === 7 ? [5, 4, 3, 2, 1, 0] : [5, 0];

                        if (val === '') {
                            if (student.grades) delete student.grades[sub];
                        } else {
                            const num = parseInt(val);
                            if (!isNaN(num) && available.includes(num)) {
                                if (!student.grades) student.grades = {};
                                student.grades[sub] = num;
                            } else {
                                const prev = student.grades?.[sub];
                                this.value = prev !== undefined && prev !== null ? prev : '';
                                return;
                            }
                        }
                        if (await saveStudent(student)) {
                            renderJournal();
                        }
                    });
                    input.addEventListener('keydown', function(e) { if (e.key === 'Enter') this.blur(); });
                });
            }
        }

        function renderCertSelect() {
            const select = $('certStudent');
            if (!select) return;
            const val = select.value;
            select.innerHTML = '<option value="">— Выберите ученика —</option>';
            const seventh = students.filter(s => s.course === 7).sort((a, b) => a.name.localeCompare(b.name));
            seventh.forEach(s => {
                const opt = document.createElement('option');
                opt.value = s.id;
                opt.textContent = `${s.name} (${s.faculty})`;
                select.appendChild(opt);
            });
            if (val && seventh.some(s => s.id == val)) select.value = val;
        }

        function renderTransferList() {
            const faculty = $('transferFaculty').value;
            const filtered = students.filter(s => s.faculty === faculty);
            const container = $('transferList');
            if (!container) return;

            if (!filtered.length) {
                container.innerHTML = '<div style="color:#555;padding:8px;">Нет студентов</div>';
                return;
            }

            container.innerHTML = filtered.map(s =>
                `<div><input type="checkbox" class="transfer-check" value="${s.id}"> ${s.name} (${s.course} курс)</div>`
            ).join('');
        }

        function updateUI() {
            const badge = $('roleBadge');
            if (badge) {
                badge.textContent = ROLE_NAMES[userRole] || 'Гость';
                badge.className = 'role-badge' + (userRole === 'guest' ? ' guest' : '');
            }
            $('currentRoleDisplay').textContent = ROLE_NAMES[userRole];

            const canManage = userRole === 'dean' || userRole === 'headmaster';
            $('addBtn').style.display = canManage ? 'block' : 'none';
            $('transferBtn').style.display = canManage ? 'block' : 'none';
            $('clearBtn').style.display = canManage ? 'block' : 'none';

            const isAdmin = userRole === 'headmaster';
            $('adminBtn').style.display = isAdmin ? 'inline-block' : 'none';
        }

        // ============================================================
        // ADMIN PANEL
        // ============================================================
        async function renderAdminPanel() {
            const container = $('userList');
            try {
                const users = await loadUsers();
                if (!users || !users.length) {
                    container.innerHTML = '<div style="color:#555;padding:10px;">Нет пользователей</div>';
                    return;
                }
                container.innerHTML = users.map(u => `
                        <div class="user-item">
                            <span><strong>${u.display_name || u.username}</strong> (@${u.username})</span>
                            <span class="user-role user-role-${u.role}">${ROLE_NAMES[u.role] || u.role}</span>
                            ${u.username !== 'headmaster' ? `<button class="user-del" data-id="${u.id}">✕</button>` : ''}
                        </div>

                container.querySelectorAll('.user-del').forEach(btn => {
                    btn.addEventListener('click', async function() {

                            await deleteUserDB(id);
                            showStatus('adminStatus', '✅ Удален', 'success');

                container.innerHTML = '<div style="color:#ef5350;padding:10px;">Ошибка</div>';

        // ============================================================
        // CERTIFICATE
        // ============================================================
        function generateCertificate(studentId) {
            const student = students.find(s => s.id == studentId);
            if (!student) { alert('Ученик не найден'); return; }

            const subs = SUBJECTS[7];
            const order = ['Заклинания', 'Зельеварение', 'ЗоТИ', 'История магии', 'Маггловедение',

            ];

                        <div style="font-family:'Cinzel Decorative',serif;font-size:1.2rem;text-align:center;border-bottom:2px solid #b8860b;padding-bottom:6px;">HOGWARTS SCHOOL OF<br>WITCHCRAFT AND WIZARDRY</div>
                        <div style="text-align:center;font-size:1.4rem;font-weight:700;letter-spacing:4px;color:#b8860b;margin:4px 0;">CERTIFICATE OF COMPLETION</div>
                        <div style="text-align:center;font-size:1.6rem;font-weight:700;margin:4px 0 10px;border-bottom:1px dashed #b8860b;padding-bottom:6px;">${student.name.toUpperCase()}</div>

                                <div style="font-weight:600;">${DIRECTOR}</div>
                                <div style="font-size:0.6rem;color:#666;">Директор</div>

                        </div>
                    </div>

            $('certContainer').innerHTML = html;

        async function downloadCertificate() {
            const el = $('certificateDisplay');
            if (!el) { alert('Сначала сгенерируйте аттестат'); return; }

            if (typeof html2canvas === 'undefined') {
                alert('Библиотека html2canvas загружается... Подождите');
                return;
            }

            try {
                const canvas = await html2canvas(el, { scale: 2, backgroundColor: '#f5e6c8' });
                const link = document.createElement('a');
                const name = $('certStudent').options[$('certStudent').selectedIndex]?.text || 'student';
                link.download = `Аттестат_${name}.png`;
                link.href = canvas.toDataURL('image/png');
                link.click();
            } catch (err) {
                alert('Ошибка: ' + err.message);
            }
        }

        // ============================================================
        // REPORT
        // ============================================================
        function generateReport() {
            const grouped = {};
            students.forEach(s => {
                const c = s.course || '?';
                if (!grouped[c]) grouped[c] = [];
                grouped[c].push(s);
            });

            const sorted = Object.keys(grouped).sort((a, b) => {
                if (a === '?') return 1;
                if (b === '?') return -1;
                return parseInt(a) - parseInt(b);
            });

            let html = '';
            sorted.forEach(c => {
                const list = grouped[c];
                const subs = SUBJECTS[parseInt(c)] || SUBJECTS[1];
                html += `<h3 style="color:#d4af37;margin:12px 0 6px;">${c} курс (${subs.length} предметов)</h3>
                        <table style="font-size:0.7rem;width:100%;border-collapse:collapse;">
                        <thead><tr><th>Ученик</th><th>Факультет</th>`;
                subs.forEach(s => { html += `<th>${s}</th>`; });
                html += `<th>Сумма</th></tr></thead><tbody>`;

                list.forEach(st => {
                    html += `<tr class="${getFacultyClass(st.faculty)}"><td><strong>${st.name}</strong></td><td style="color:#666;font-size:0.6rem;">${st.faculty}</td>`;
                    let sum = 0;
                    subs.forEach(sub => {
                        const v = st.grades?.[sub];
                        const has = v !== undefined && v !== null;
                        html +=
                            `<td style="text-align:center;font-weight:600;color:${has ? GRADE_COLORS[v] || '#e8e4d8' : '#555'};">${has ? v : ''}</td>`;
                        if (has) sum += v;
                    });
                    html += `<td style="font-weight:700;color:#d4af37;text-align:center;">${sum}</td></tr>`;
                });
                html += `</tbody></table>`;
            });

            if (!Object.keys(grouped).length) html = '<p style="color:#555;text-align:center;padding:20px;">Нет данных</p>';
            return html;
        }

        function exportExcel() {
            try {
                const grouped = {};
                students.forEach(s => {
                    const c = s.course || '?';
                    if (!grouped[c]) grouped[c] = [];
                    grouped[c].push(s);
                });

                let html =
                    `<html><head><meta charset="UTF-8"><style>table{border-collapse:collapse;font-family:Arial;font-size:12px;}th{background:#d4af37;padding:6px 8px;border:1px solid #000;}td{padding:4px 8px;border:1px solid #999;}.course-title{font-size:16px;font-weight:bold;padding:10px 0;}</style></head><body>`;
                for (let c = 1; c <= 7; c++) {
                    const list = grouped[c] || [];
                    const subjects = SUBJECTS[c] || [];
                    html += `<div class="course-title">${c} курс</div><table><tr><th>Ученик</th><th>Факультет</th>`;
                    subjects.forEach(s => { html += `<th>${s}</th>`; });
                    html += `<th>Сумма</th></tr>`;
                    if (!list.length) {
                        html += `<tr><td colspan="${subjects.length + 3}" style="text-align:center;color:#999;">Нет студентов</td></tr>`;
                    } else {
                        list.forEach(st => {
                            html += `<tr><td>${st.name}</td><td>${st.faculty}</td>`;
                            let sum = 0;
                            subjects.forEach(sub => {
                                const v = st.grades?.[sub];
                                const val = (v !== undefined && v !== null) ? v : '';
                                html += `<td style="text-align:center;">${val}</td>`;
                                if (val) sum += parseInt(val);
                            });
                            html += `<td style="text-align:center;font-weight:bold;color:#b8860b;">${sum}</td></tr>`;
                        });
                    }
                    html += `</table><br>`;
                }
                html += `</body></html>`;

                const blob = new Blob([html], { type: 'application/vnd.ms-excel' });
                const link = document.createElement('a');
                link.href = URL.createObjectURL(blob);
                link.download = `HogwartsDaily_${new Date().toISOString().slice(0, 10)}.xls`;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                alert('✅ Excel скачан!');
            } catch (err) { alert('❌ Ошибка: ' + err.message); }
        }

        // ============================================================
        // LOGIN
        // ============================================================
        async function login() {
            const username = $('loginUsername').value.trim();
            const password = $('loginPassword').value;
            const errorBox = $('loginError');

            if (!username || !password) {
                errorBox.textContent = '❌ Введите логин и пароль';
                errorBox.className = 'status-msg show error';
                return;
            }

            try {
                const { data: user, error } = await db.from('users')
                    .select('*')
                    .eq('username', username)
                    .maybeSingle();

                if (error || !user) {
                    errorBox.textContent = '❌ Пользователь не найден';
                    errorBox.className = 'status-msg show error';
                    return;
                }

                const hash = await sha256(password);
                if (hash !== user.password) {
                    errorBox.textContent = '❌ Неверный пароль';
                    errorBox.className = 'status-msg show error';
                    return;
                }

                userRole = user.role || 'guest';
                userName = user.display_name || user.username;
                $('loginPassword').value = '';
                $('loginModal').classList.remove('open');
                renderAll();
                alert('🔓 Добро пожаловать, ' + userName + '!');
            } catch (err) {
                errorBox.textContent = '❌ Ошибка: ' + err.message;
                errorBox.className = 'status-msg show error';
            }
        }

        // ============================================================
        // EVENT BINDINGS
        // ============================================================
        document.addEventListener('DOMContentLoaded', async function() {
            // Load html2canvas for certificate
            const script = document.createElement('script');
            script.src = 'https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js';
            document.head.appendChild(script);

            await loadStudents();

            // Course select
            $('courseSelect').addEventListener('change', function() {
                currentCourse = parseInt(this.value);
                renderAll();
            });

            // Faculty select
            document.querySelectorAll('.faculty-item').forEach(el => {
                el.addEventListener('click', function() {
                    currentFaculty = this.dataset.faculty;
                    renderAll();
                });
            });

            // Login
            $('loginBtn').addEventListener('click', () => $('loginModal').classList.add('open'));
            $('closeLoginBtn').addEventListener('click', () => $('loginModal').classList.remove('open'));
            $('loginConfirmBtn').addEventListener('click', login);
            $('loginPassword').addEventListener('keydown', e => { if (e.key === 'Enter') login(); });

            // Logout
            $('logoutBtn').addEventListener('click', function() {
                userRole = 'guest';
                userName = '';
                $('loginModal').classList.remove('open');
                renderAll();
                alert('🚪 Вы вышли');
            });

            // Close modals on overlay click
            document.querySelectorAll('.modal').forEach(modal => {
                modal.addEventListener('click', e => { if (e.target === modal) modal.classList.remove('open'); });
            });

            // Add students
            $('addBtn').addEventListener('click', function() {
                if (userRole !== 'dean' && userRole !== 'headmaster') {
                    alert('Доступ только у деканов и завуча');
                    return;
                }
                $('addModal').classList.add('open');
                $('addNames').value = '';
                $('addStatus').className = 'status-msg';
            });
            $('closeAddBtn').addEventListener('click', () => $('addModal').classList.remove('open'));
            $('addCancelBtn').addEventListener('click', () => $('addModal').classList.remove('open'));

            $('addConfirmBtn').addEventListener('click', async function() {
                const names = $('addNames').value;
                const faculty = $('addFaculty').value;
                const course = parseInt($('addCourse').value);

                if (!names.trim()) {
                    showStatus('addStatus', '❌ Введите имена', 'error');
                    return;
                }

                const lines = names.split('\n').filter(l => l.trim());
                let added = 0;
                for (const line of lines) {
                    const name = line.trim();
                    if (!name) continue;
                    if (students.some(s => s.name === name && s.faculty === faculty && s.course === course)) continue;

                    const newStudent = {
                        id: Date.now() + Math.random() * 1000 + added,
                        name: name,
                        faculty: faculty,
                        course: course,
                        grades: {}
                    };

                    if (await saveStudent(newStudent)) {
                        students.push(newStudent);
                        added++;
                    }
                }

                if (added > 0) {
                    showStatus('addStatus', `✅ Добавлено: ${added}`, 'success');
                    $('addNames').value = '';
                    renderAll();
                } else {
                    showStatus('addStatus', '❌ Ошибка или дубликаты', 'error');
                }
            });

            // Transfer
            $('transferBtn').addEventListener('click', function() {
                if (userRole !== 'dean' && userRole !== 'headmaster') {
                    alert('Доступ только у деканов и завуча');
                    return;
                }
                $('transferModal').classList.add('open');
                $('transferStatus').className = 'status-msg';
                renderTransferList();
            });
            $('closeTransferBtn').addEventListener('click', () => $('transferModal').classList.remove('open'));
            $('transferCancelBtn').addEventListener('click', () => $('transferModal').classList.remove('open'));
            $('transferFaculty').addEventListener('change', renderTransferList);

            $('transferConfirmBtn').addEventListener('click', async function() {
                const checks = document.querySelectorAll('.transfer-check:checked');
                if (!checks.length) {
                    showStatus('transferStatus', '❌ Выберите студентов', 'error');
                    return;
                }

                const newCourse = parseInt($('transferCourse').value);
                let transferred = 0;

                for (const check of checks) {
                    const id = parseInt(check.value);
                    const student = students.find(s => s.id === id);
                    if (!student || student.course === newCourse) continue;
                    student.course = newCourse;
                    student.grades = {};
                    if (await saveStudent(student)) transferred++;
                }

                if (transferred > 0) {
                    showStatus('transferStatus', `✅ Переведено: ${transferred}`, 'success');
                    renderAll();
                } else {
                    showStatus('transferStatus', '❌ Ошибка', 'error');
                }
            });

            // Clear faculty
            $('clearBtn').addEventListener('click', async function() {
                if (userRole !== 'dean' && userRole !== 'headmaster') {
                    alert('Доступ только у деканов и завуча');
                    return;
                }
                const toDel = students.filter(s => s.faculty === currentFaculty);
                if (!toDel.length) { alert('Нет студентов'); return; }
                if (!confirm(`Удалить всех с ${currentFaculty}?`)) return;

                let deleted = 0;
                for (const s of toDel) {
                    if (await deleteStudent(s.id)) deleted++;
                }
                if (deleted > 0) {
                    students = students.filter(s => s.faculty !== currentFaculty);
                    renderAll();
                }
            });

            // Admin
            $('adminBtn').addEventListener('click', function() {
                if (userRole !== 'headmaster') {
                    alert('Доступ только у завуча');
                    return;
                }
                $('adminModal').classList.add('open');
                $('adminStatus').className = 'status-msg';
                renderAdminPanel();
            });
            $('closeAdminBtn').addEventListener('click', () => $('adminModal').classList.remove('open'));
            $('adminModal').addEventListener('click', e => { if (e.target === e.currentTarget) $('adminModal').classList
                    .remove('open'); });

            $('adminAddBtn').addEventListener('click', async function() {
                const username = $('adminUsername').value.trim();
                const password = $('adminPassword').value.trim();
                const role = $('adminRole').value;
                const displayName = $('adminDisplayName').value.trim() || username;

                if (!username || !password) {
                    showStatus('adminStatus', '❌ Заполните поля', 'error');
                    return;
                }

                try {
                    await addUserDB(username, password, role, displayName);
                    showStatus('adminStatus', `✅ Пользователь ${username} добавлен`, 'success');
                    $('adminUsername').value = '';
                    $('adminPassword').value = '';
                    $('adminDisplayName').value = '';
                    renderAdminPanel();
                } catch (err) {
                    showStatus('adminStatus', '❌ ' + err.message, 'error');
                }
            });

            // Certificate
            $('certBtn').addEventListener('click', function() {
                if (currentCourse !== 7) { alert('Аттестат только для 7 курса'); return; }
                $('certModal').classList.add('open');
                renderCertSelect();
            });
            $('closeCertBtn').addEventListener('click', () => $('certModal').classList.remove('open'));

            $('generateCertBtn').addEventListener('click', function() {
                const id = $('certStudent').value;
                if (!id) { alert('Выберите ученика'); return; }
                generateCertificate(id);
            });
            $('downloadCertBtn').addEventListener('click', downloadCertificate);

            // Report
            $('reportBtn').addEventListener('click', function() {
                $('reportContainer').innerHTML = generateReport();
                $('reportModal').classList.add('open');
            });
            $('closeReportBtn').addEventListener('click', () => $('reportModal').classList.remove('open'));
            $('exportBtn').addEventListener('click', exportExcel);

            renderAll();
        });
    </script>
</body>
</html>
